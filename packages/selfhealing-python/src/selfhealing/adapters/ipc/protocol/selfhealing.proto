// Self-Healing Sidecar gRPC 서비스 정의
//
// 타언어 애플리케이션(Go, Java 등)이 Self-Healing 시스템을
// 사이드카를 통해 사용할 수 있도록 gRPC 인터페이스를 정의합니다.

syntax = "proto3";

package selfhealing.v1;

option go_package = "github.com/myproject/selfhealing-go/v1";
option java_package = "com.selfhealing.v1";
option java_multiple_files = true;

// =============================================================================
// Common Types
// =============================================================================

message Empty {}

// W3C Trace Context 분산 트레이싱 지원
message TraceContext {
  // W3C traceparent: "00-{trace_id}-{span_id}-{flags}"
  string traceparent = 1;
  // 벤더 확장 (선택)
  string tracestate = 2;
}

// =============================================================================
// Circuit Breaker Service
// =============================================================================

service CircuitBreakerService {
  // 요청 허용 여부 확인
  rpc ShouldAllow(ShouldAllowRequest) returns (ShouldAllowResponse);

  // 배치 요청 허용 여부 확인 (다수 서비스 한번에 체크)
  rpc ShouldAllowBatch(ShouldAllowBatchRequest) returns (ShouldAllowBatchResponse);

  // 서킷 브레이커 상태 조회
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // 전체 서킷 브레이커 상태 목록 조회
  rpc GetAllStates(Empty) returns (GetAllStatesResponse);

  // 서킷 브레이커 강제 열기 (요청 차단)
  rpc ForceOpen(ForceOpenRequest) returns (CircuitBreakerResult);

  // 서킷 브레이커 강제 닫기 (요청 허용)
  rpc ForceClose(ForceCloseRequest) returns (CircuitBreakerResult);
}

message ShouldAllowRequest {
  string service_name = 1;
  TraceContext trace_context = 2;
}

message ShouldAllowResponse {
  bool allowed = 1;
  string state = 2;  // "closed", "open", "half_open"
  int32 failure_count = 3;
  int32 success_count = 4;
}

message ShouldAllowBatchRequest {
  repeated string service_names = 1;  // 최대 100개
  TraceContext trace_context = 2;
}

message ShouldAllowBatchResponse {
  map<string, ServiceState> results = 1;
}

message ServiceState {
  bool allowed = 1;
  string state = 2;      // "closed", "open", "half_open"
  int32 failure_count = 3;
  int32 success_count = 4;
}

message GetStateRequest {
  string service_name = 1;
}

message GetStateResponse {
  string service_name = 1;
  string state = 2;
  int32 failure_count = 3;
  int32 success_count = 4;
  string opened_at = 5;  // ISO8601 timestamp (open 상태일 때)
  string controlled_by = 6;
  string reason = 7;
}

message GetAllStatesResponse {
  repeated GetStateResponse states = 1;
}

message ForceOpenRequest {
  string service_name = 1;
  string reason = 2;
  string controlled_by = 3;
  TraceContext trace_context = 4;
}

message ForceCloseRequest {
  string service_name = 1;
  string reason = 2;
  string controlled_by = 3;
  bool trigger_replay = 4;  // 닫을 때 DLQ 재처리 트리거 여부
  TraceContext trace_context = 5;
}

message CircuitBreakerResult {
  bool success = 1;
  string service_name = 2;
  string previous_state = 3;
  string new_state = 4;
  string message = 5;
  string error = 6;
}

// =============================================================================
// DLQ Service
// =============================================================================

service DLQService {
  // 실패 작업 DLQ에 저장
  rpc Store(DLQStoreRequest) returns (DLQStoreResponse);

  // DLQ 엔트리 재처리
  rpc Replay(DLQReplayRequest) returns (DLQReplayResponse);

  // DLQ 엔트리 조회
  rpc GetEntry(DLQGetEntryRequest) returns (DLQEntry);

  // DLQ 목록 조회
  rpc ListEntries(DLQListRequest) returns (DLQListResponse);
}

message DLQStoreRequest {
  string domain = 1;
  string failure_type = 2;
  string error_code = 3;
  string error_message = 4;
  bytes snapshot_data = 5;   // JSON serialized
  bytes request_data = 6;    // JSON serialized
  optional string entity_type = 7;
  optional string entity_id = 8;
  optional int64 user_id = 9;
  optional int32 max_retries = 10;
  bytes metadata = 11;       // JSON serialized (추가 메타데이터)
  TraceContext trace_context = 12;
}

message DLQStoreResponse {
  bool success = 1;
  int64 entry_id = 2;
  string message = 3;
  string error = 4;
}

message DLQReplayRequest {
  int64 entry_id = 1;
  string actor_id = 2;       // 재처리 실행자
  bool force = 3;            // 최대 재시도 무시 강제 실행
  TraceContext trace_context = 4;
}

message DLQReplayResponse {
  bool success = 1;
  int64 entry_id = 2;
  string status = 3;         // "success", "failed", "pending"
  string message = 4;
  string error = 5;
}

message DLQGetEntryRequest {
  int64 entry_id = 1;
}

message DLQEntry {
  int64 id = 1;
  string domain = 2;
  string failure_type = 3;
  string error_code = 4;
  string error_message = 5;
  bytes snapshot_data = 6;
  bytes request_data = 7;
  string entity_type = 8;
  string entity_id = 9;
  int64 user_id = 10;
  int32 retry_count = 11;
  int32 max_retries = 12;
  string status = 13;        // "pending", "resolved", "failed"
  string created_at = 14;    // ISO8601
  string updated_at = 15;    // ISO8601
}

message DLQListRequest {
  string domain = 1;         // 필터: 도메인
  string status = 2;         // 필터: 상태
  int32 limit = 3;           // 최대 개수 (기본 100)
  int32 offset = 4;          // 오프셋
}

message DLQListResponse {
  repeated DLQEntry entries = 1;
  int64 total_count = 2;
}

// =============================================================================
// Buffer Service (영속성 버퍼)
// =============================================================================

service BufferService {
  // 버퍼에 데이터 저장 (네트워크 장애 시 임시 보관)
  rpc Store(BufferStoreRequest) returns (BufferStoreResponse);

  // 버퍼 플러시 (외부 시스템으로 전송)
  rpc Flush(BufferFlushRequest) returns (BufferFlushResponse);

  // 버퍼 상태 조회
  rpc GetStats(Empty) returns (BufferStats);
}

message BufferStoreRequest {
  string entry_type = 1;      // "dlq", "audit", "metric"
  bytes data = 2;             // JSON serialized
  string dedup_key = 3;       // 중복 방지 키 (선택)
  TraceContext trace_context = 4;
}

message BufferStoreResponse {
  bool success = 1;
  int64 sequence = 2;         // 저장된 시퀀스 번호
  string error = 3;
}

message BufferFlushRequest {
  string entry_type = 1;      // 특정 타입만 플러시 (빈값 = 전체)
  int32 max_entries = 2;      // 최대 플러시 개수
}

message BufferFlushResponse {
  int32 flushed_count = 1;
  int32 failed_count = 2;
  string error = 3;
}

message BufferStats {
  int64 total_entries = 1;
  int64 pending_flush = 2;
  string state = 3;           // "active", "disk_full_failopen", "closed"
  int64 bytes_used = 4;
  int64 bytes_limit = 5;
}

// =============================================================================
// Event Service (이벤트 스트리밍)
// =============================================================================

service EventService {
  // 이벤트 구독 (Server-side streaming)
  rpc SubscribeEvents(EventSubscription) returns (stream SelfHealingEvent);

  // 이벤트 발행 (클라이언트 → 사이드카)
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
}

message EventSubscription {
  // 구독할 이벤트 타입 목록
  // 예: ["circuit_breaker_opened", "emergency_level_changed"]
  repeated string event_types = 1;

  // 클라이언트 식별자
  string client_id = 2;
}

message SelfHealingEvent {
  string event_type = 1;
  string source = 2;
  string timestamp = 3;       // ISO8601
  bytes data = 4;             // JSON serialized
  string correlation_id = 5;
  int32 priority = 6;         // 1=LOW, 2=NORMAL, 3=HIGH, 4=CRITICAL
}

message PublishEventRequest {
  string event_type = 1;
  bytes data = 2;             // JSON serialized
  string source = 3;
  TraceContext trace_context = 4;
}

message PublishEventResponse {
  bool success = 1;
  string error = 2;
}

// =============================================================================
// Learning Service
// =============================================================================

service LearningService {
  // 성공 패턴 기록
  rpc RecordSuccess(RecordRequest) returns (Empty);

  // 실패 패턴 기록
  rpc RecordFailure(RecordFailureRequest) returns (Empty);

  // 개선 제안 조회
  rpc GetSuggestions(GetSuggestionsRequest) returns (SuggestionList);

  // 패턴 분석
  rpc AnalyzePatterns(Empty) returns (PatternList);
}

message RecordRequest {
  string pattern_type = 1;
  bytes context = 2;          // JSON serialized
  TraceContext trace_context = 3;
}

message RecordFailureRequest {
  string pattern_type = 1;
  bytes context = 2;          // JSON serialized
  string error = 3;
  TraceContext trace_context = 4;
}

message GetSuggestionsRequest {
  int32 limit = 1;            // 기본 10
}

message Suggestion {
  string suggestion_type = 1;
  string description = 2;
  int32 priority = 3;         // 1=LOW, 2=MEDIUM, 3=HIGH
  bytes parameters = 4;       // JSON serialized
}

message SuggestionList {
  repeated Suggestion suggestions = 1;
}

message LearningPattern {
  string pattern_type = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  float success_rate = 4;
  string last_seen = 5;       // ISO8601
}

message PatternList {
  repeated LearningPattern patterns = 1;
}

// =============================================================================
// Health Service
// =============================================================================

service HealthService {
  // 사이드카 건강 상태 확인
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // 상세 건강 정보
  rpc GetDetails(Empty) returns (HealthDetails);
}

message HealthCheckRequest {
  string service = 1;         // 특정 서비스 (빈값 = 전체)
}

message HealthCheckResponse {
  string status = 1;          // "SERVING", "NOT_SERVING", "UNKNOWN"
}

message HealthDetails {
  string overall_status = 1;
  map<string, ComponentHealth> components = 2;
  string version = 3;
  string uptime = 4;
}

message ComponentHealth {
  string status = 1;          // "healthy", "degraded", "unhealthy"
  float latency_ms = 2;
  string error = 3;
  map<string, string> details = 4;
}
