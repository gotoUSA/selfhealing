# pytest 설정 (패키지 단독 테스트용)
# 루트 pyproject.toml의 설정을 오버라이드하여 빠른 테스트 실행
#
# 사용법:
#   빠른 테스트:  pytest tests -v
#   커버리지 포함: pytest tests --cov=src/selfhealing --cov-report=term-missing

[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test* *Tests

# 기본 옵션: 커버리지 없이 빠르게 실행
# 커버리지 필요시: pytest --cov=src/selfhealing --cov-report=term-missing
# 상세 출력: pytest -v
addopts = --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    tier1: fundamental functionality tests
    tier2: integration tests
    tier3_chaos: chaos engineering tests
