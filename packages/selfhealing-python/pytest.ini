# pytest 설정 (패키지 단독 테스트용)
# 루트 pyproject.toml의 설정을 오버라이드하여 빠른 테스트 실행
#
# 사용법:
#   빠른 테스트:  pytest tests -v
#   커버리지 포함: pytest tests --cov=src/selfhealing --cov-report=term-missing

[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test* *Tests

# 기본 옵션: 커버리지 없이 빠르게 실행
# 커버리지 필요시: pytest --cov=src/selfhealing --cov-report=term-missing
# 상세 출력: pytest -v
# -p no:celery: pytest-celery 플러그인이 session teardown 시
#   Redis 브로커 연결을 시도하며 행이 걸리는 문제 방지
#   (순수 단위 테스트에서는 불필요. Celery 통합 테스트는 tests/hybrid/ 에서 별도 실행)
addopts = --tb=short -p no:celery

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    tier1: fundamental functionality tests
    tier2: integration tests
    tier3_chaos: chaos engineering tests
