[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfhealing"
version = "0.1.0"
description = "Self-Healing Reliability Layer for Python Applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shopping Mall Team" },
]
keywords = [
    "circuit-breaker",
    "dead-letter-queue",
    "dlq",
    "fault-tolerance",
    "resilience",
    "retry",
    "self-healing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
django = [
    "django>=4.2",
    "djangorestframework>=3.14",
]
celery = [
    "celery>=5.3",
    "redis>=4.0",
]
prometheus = [
    "prometheus-client>=0.17",
]
all = [
    "selfhealing[django,celery,prometheus]",
]
dev = [
    "selfhealing[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-django>=4.5",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/gotoUSA/selfhealing-python"
Documentation = "https://github.com/gotoUSA/selfhealing-python#readme"
Repository = "https://github.com/gotoUSA/selfhealing-python"
Issues = "https://github.com/gotoUSA/selfhealing-python/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/selfhealing"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "django_db: mark test as requiring database access",
    "tier1: fundamental functionality tests",
    "tier2: integration tests",
    "tier3_chaos: chaos engineering tests",
]
# Django 통합 테스트는 Django 프로젝트 환경에서만 실행
# selfhealing-python 패키지 단독 테스트 시 제외
norecursedirs = ["tests/integration/django"]
DJANGO_SETTINGS_MODULE = ""

[tool.coverage.run]
source = ["src/selfhealing"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["selfhealing"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.isort]
known-first-party = ["selfhealing"]
