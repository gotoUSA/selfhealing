# Docker Compose 설정 파일 (version 제거)
services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=shopping_db
      - POSTGRES_USER=shopping_user
      - POSTGRES_PASSWORD=shopping_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_user -d shopping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Celery 브로커 및 캐시)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django 웹 애플리케이션 (Gunicorn)
  web:
    image: myproject-app:latest
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn myproject.wsgi:application -c gunicorn.conf.py"
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # Python 경로 (selfhealing 패키지 포함)
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      # Chaos Mode Configuration (disabled by default)
      - CHAOS_MODE=${CHAOS_MODE:-false}
      - CHAOS_PAYMENT_CONFIRM_DELAY=${CHAOS_PAYMENT_CONFIRM_DELAY:-false}
      - CHAOS_PARTIAL_FAILURE=${CHAOS_PARTIAL_FAILURE:-false}
      - CHAOS_RACE_AMPLIFICATION=${CHAOS_RACE_AMPLIFICATION:-false}
      - CHAOS_ASYNC_TASK_FAILURE=${CHAOS_ASYNC_TASK_FAILURE:-false}
      - CHAOS_PAYMENT_CONFIRM_DELAY_MS=${CHAOS_PAYMENT_CONFIRM_DELAY_MS:-2000}
      - CHAOS_RACE_DELAY_MS=${CHAOS_RACE_DELAY_MS:-500}
      - CHAOS_PARTIAL_FAILURE_PROB=${CHAOS_PARTIAL_FAILURE_PROB:-0.3}
      - CHAOS_ASYNC_TASK_FAILURE_PROB=${CHAOS_ASYNC_TASK_FAILURE_PROB:-0.2}
      - CHAOS_RACE_TRIGGER_PROB=${CHAOS_RACE_TRIGGER_PROB:-0.4}
      # Phase 2 Chaos Mode Configuration (ENABLED for testing)
      - PHASE2_CHAOS_MODE=true
      - PHASE2_ORPHAN_PG=true
      - PHASE2_ROLLBACK_FAILURE=true
      - PHASE2_SILENT_TASK=true
      - PHASE2_POINT_ORPHAN=true
      - PHASE2_RACE_AMPLIFY=true
      - PHASE2_CACHE_DIVERGENCE=true
      # Self-Healing Configuration (ENABLED for Phase 2 testing)
      - PAYMENT_CIRCUIT_BREAKER_ENABLED=true
      - PAYMENT_CB_FAILURE_THRESHOLD=5
      - PAYMENT_CB_RECOVERY_TIMEOUT=60
      - PAYMENT_CB_SUCCESS_THRESHOLD=2
      - PAYMENT_DLQ_ENABLED=true
      # Stage 48: X-Test-Mode Configuration
      - CHAOS_ENABLED=true
      - ENVIRONMENT=development
      # OpenTelemetry SDK Configuration
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-selfhealing}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.01}
      - OTEL_ADAPTIVE_SAMPLING_ENABLED=${OTEL_ADAPTIVE_SAMPLING_ENABLED:-true}
      - OTEL_SLA_CRITICAL_MS=${OTEL_SLA_CRITICAL_MS:-500}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx (리버스 프록시)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    ports:
      - "8000:80"
    depends_on:
      - web

  # Celery Worker (백그라운드 작업 처리)
  celery_worker:
    image: myproject-app:latest
    command: celery -A myproject worker -l info --concurrency=8 -Q default,payment_critical,order_processing,external_api,points,notifications --prefetch-multiplier=1
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      # Python 경로 (selfhealing 패키지 포함)
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      # Chaos Mode Configuration (disabled by default)
      - CHAOS_MODE=${CHAOS_MODE:-false}
      - CHAOS_PAYMENT_CONFIRM_DELAY=${CHAOS_PAYMENT_CONFIRM_DELAY:-false}
      - CHAOS_PARTIAL_FAILURE=${CHAOS_PARTIAL_FAILURE:-false}
      - CHAOS_RACE_AMPLIFICATION=${CHAOS_RACE_AMPLIFICATION:-false}
      - CHAOS_ASYNC_TASK_FAILURE=${CHAOS_ASYNC_TASK_FAILURE:-false}
      - CHAOS_PAYMENT_CONFIRM_DELAY_MS=${CHAOS_PAYMENT_CONFIRM_DELAY_MS:-2000}
      - CHAOS_RACE_DELAY_MS=${CHAOS_RACE_DELAY_MS:-500}
      - CHAOS_PARTIAL_FAILURE_PROB=${CHAOS_PARTIAL_FAILURE_PROB:-0.3}
      - CHAOS_ASYNC_TASK_FAILURE_PROB=${CHAOS_ASYNC_TASK_FAILURE_PROB:-0.2}
      - CHAOS_RACE_TRIGGER_PROB=${CHAOS_RACE_TRIGGER_PROB:-0.4}
      # Phase 2 Chaos Mode Configuration (ENABLED for testing)
      - PHASE2_CHAOS_MODE=true
      - PHASE2_ORPHAN_PG=true
      - PHASE2_ROLLBACK_FAILURE=true
      - PHASE2_SILENT_TASK=true
      - PHASE2_POINT_ORPHAN=true
      - PHASE2_RACE_AMPLIFY=true
      - PHASE2_CACHE_DIVERGENCE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (주기적 작업 스케줄러)
  celery_beat:
    image: myproject-app:latest
    command: celery -A myproject beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Flower (Celery 모니터링 도구 - 선택사항)
  flower:
    image: myproject-app:latest
    command: celery -A myproject flower
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector - 텔레메트리 수집 및 분배
  # ---------------------------------------------------------------------------
  # 참고: 원본 이미지(otel/opentelemetry-collector-contrib)는 scratch 기반으로
  # wget/curl/sh가 없어 Docker Compose 헬스체크 불가능.
  # Alpine 기반 커스텀 이미지로 빌드하여 wget 헬스체크 지원.
  # Kubernetes 환경에서는 외부 livenessProbe로 원본 이미지 사용 가능.
  # ---------------------------------------------------------------------------
  otel-collector:
    build:
      context: ./docker/otel-collector
      dockerfile: Dockerfile
      args:
        OTEL_VERSION: "0.144.0"
    container_name: otel-collector
    command: ["--config=/etc/otelcol/otel-collector-config.yml"]
    volumes:
      - ./docker/otel-collector:/etc/otelcol
      - otel_buffer:/var/lib/otelcol/buffer
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # 메트릭 노출
      - "13133:13133" # 헬스체크
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=selfhealing,deployment.environment=development
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana Tempo - 분산 추적 저장소
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/tempo:/etc/tempo
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API
      - "9095:9095"   # gRPC
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Grafana Mimir - 메트릭 장기 저장소 (Prometheus 호환)
  # ---------------------------------------------------------------------------
  mimir:
    image: grafana/mimir:2.11.0
    container_name: mimir
    command: ["-config.file=/etc/mimir/mimir.yml"]
    volumes:
      - ./docker/mimir:/etc/mimir
      - mimir_data:/var/mimir
    ports:
      - "9009:9009"   # HTTP API
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9009/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Grafana Loki - 로그 저장소
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/loki:/etc/loki
      - loki_data:/var/loki
    ports:
      - "3100:3100"   # HTTP API
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  static_volume:
  media_volume:
  otel_buffer:
  tempo_data:
  mimir_data:
  loki_data:
