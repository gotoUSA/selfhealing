apiVersion: 1

datasources:
  # Prometheus - 기존 메트릭 수집 (기본 데이터소스)
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      # Metrics → Traces Exemplar 연동 설정
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"

  # Mimir - 메트릭 장기 저장소 (Prometheus Remote Write 수신)
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      # Metrics → Traces Exemplar 연동 설정
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"

  # Tempo - 분산 추적 저장소 (OTLP Trace 수신)
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags.service.name}"} | json | trace_id="$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        tags:
          - key: "service.name"
            value: "service_name"
        queries:
          - name: "Request Rate"
            query: 'sum(rate(http_server_request_duration_seconds_count{service_name="$${__span.tags.service.name}"}[5m]))'
          - name: "Error Rate"
            query: 'sum(rate(http_server_request_duration_seconds_count{service_name="$${__span.tags.service.name}", http_status_code=~"5.."}[5m]))'
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  # Loki - 로그 저장소 (OTLP Log 수신)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
        - datasourceUid: tempo
          matcherRegex: 'trace_id=([a-f0-9]+)'
          name: TraceID_Plain
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
      maxLines: 1000
