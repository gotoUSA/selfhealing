apiVersion: 1

datasources:
  # Prometheus - 기존 메트릭 수집 (기본 데이터소스)
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      # Metrics → Traces Exemplar 연동 설정
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"

  # Mimir - 메트릭 장기 저장소 (Prometheus Remote Write 수신)
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      # Metrics → Traces Exemplar 연동 설정
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"

  # Tempo - 분산 추적 저장소 (OTLP Trace 수신)
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags.service.name}"} | json | trace_id="$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        tags:
          - key: "service.name"
            value: "service_name"
        queries:
          - name: "Request Rate"
            query: 'sum(rate(http_server_request_duration_seconds_count{service_name="$${__span.tags.service.name}"}[5m]))'
          - name: "Error Rate"
            query: 'sum(rate(http_server_request_duration_seconds_count{service_name="$${__span.tags.service.name}", http_status_code=~"5.."}[5m]))'
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  # Loki - 로그 저장소 (OTLP Log 수신)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      derivedFields:
        # W3C 32자리 hex trace_id (OTEL 표준)
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          name: TraceID_W3C
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
        # req- 접두사 형식 (클러스터 prefix 있음: req-seop-a1b2c3d4)
        - datasourceUid: tempo
          matcherRegex: 'req-([a-z]{3,4})-([a-f0-9]{8})'
          name: TraceID_Clustered
          url: "req-$${__value.raw}"
          urlDisplayLabel: "View Trace (Cluster)"
        # req- 접두사 형식 (클러스터 prefix 없음: req-a1b2c3d4)
        - datasourceUid: tempo
          matcherRegex: 'req-([a-f0-9]{8})(?![a-f0-9])'
          name: TraceID_Simple
          url: "req-$${__value.raw}"
          urlDisplayLabel: "View Trace"
        # JSON 형식 trace_id (일반)
        - datasourceUid: tempo
          matcherRegex: 'trace_id=([a-f0-9]+)'
          name: TraceID_Plain
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
      maxLines: 1000

  # =========================================================================
  # 멀티 리전 Datasource 템플릿 (주석 처리 - 필요 시 활성화)
