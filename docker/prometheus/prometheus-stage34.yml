# Prometheus configuration for Stage 34 DB Deadlock Test
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'django'
    static_configs:
      - targets: ['web:8000']
    metrics_path: /metrics

  - job_name: 'locust'
    static_configs:
      - targets: ['locust:8089']
    metrics_path: /stats/prometheus

  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
