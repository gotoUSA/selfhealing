# Prometheus configuration for Stage 33 JWT Cascade Test
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'django-primary'
    static_configs:
      - targets: ['web:8000']
    metrics_path: /metrics

  - job_name: 'django-secondary'
    static_configs:
      - targets: ['web-secondary:8000']
    metrics_path: /metrics

  - job_name: 'locust'
    static_configs:
      - targets: ['locust:8089']
    metrics_path: /stats/prometheus
