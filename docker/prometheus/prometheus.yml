# Prometheus Configuration for Self-Healing System
#
# 이 설정 파일은 Self-Healing 시스템의 메트릭 수집 및 알림을 구성합니다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # 외부 라벨 (Alertmanager 연동 시 사용)
  external_labels:
    environment: 'production'
    service: 'self-healing'

# Mimir로 메트릭 복제 (장기 저장용)
remote_write:
  - url: http://mimir:9009/api/v1/push
    send_exemplars: true
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      capacity: 5000
    metadata_config:
      send: true
      send_interval: 1m

# 알림 규칙 파일
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager 설정 (선택사항)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# 메트릭 수집 대상
scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # Django 애플리케이션 메트릭
  - job_name: 'django'
    static_configs:
      - targets: ['web:8000']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Celery Worker 메트릭 (선택사항)
  - job_name: 'celery'
    static_configs:
      - targets: ['celery:9808']
    metrics_path: /metrics

  # Redis 메트릭 (선택사항)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    metrics_path: /metrics

  # PostgreSQL 메트릭 (선택사항)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics

  # Locust 부하 테스트 메트릭 (개발/테스트 환경)
  - job_name: 'locust'
    static_configs:
      - targets: ['locust:8089']
    metrics_path: /stats/prometheus
