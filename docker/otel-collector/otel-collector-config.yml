# OpenTelemetry Collector 설정
# OTLP 수신, 배치 처리, Tempo로 Trace 전송

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # OTLP gRPC 및 HTTP 수신
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # 기존 Prometheus 호환 메트릭 scrape
  prometheus:
    config:
      scrape_configs:
        - job_name: 'django'
          static_configs:
            - targets: ['web:8000']
          metrics_path: /metrics
          scrape_interval: 15s

processors:
  # 메모리 사용량 제한
  memory_limiter:
    limit_mib: 256
    check_interval: 1s
    spike_limit_mib: 64

  # 배치 처리로 효율성 향상
  batch:
    send_batch_size: 1000
    timeout: 10s
    send_batch_max_size: 1500

  # 리소스 속성 추가
  resource:
    attributes:
      - key: service.name
        value: selfhealing
        action: upsert
      - key: deployment.environment
        value: development
        action: upsert

  # 민감 정보 마스킹
  attributes:
    actions:
      - key: password
        action: delete
      - key: token
        action: delete
      - key: api_key
        action: delete
      - key: secret
        action: delete
      - key: authorization
        action: delete

exporters:
  # Tempo로 Trace 전송
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  # 디버그 로깅 (개발 환경용)
  debug:
    verbosity: basic

service:
  extensions: [health_check]

  pipelines:
    # Traces 파이프라인
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [otlp/tempo, debug]

    # Metrics 파이프라인 (Prometheus scrape 포함)
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
