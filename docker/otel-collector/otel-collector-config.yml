# OpenTelemetry Collector 설정
# OTLP 수신, 배치 처리, Tempo/Mimir/Loki로 텔레메트리 전송

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # 디스크 기반 버퍼링 (백엔드 장애 시 데이터 보존)
  file_storage:
    directory: /var/lib/otelcol/buffer
    timeout: 1s
    compaction:
      directory: /var/lib/otelcol/buffer/compaction
      on_start: true
      on_rebound: true
      rebound_needed_threshold_mib: 50
      rebound_trigger_threshold_mib: 10

receivers:
  # OTLP gRPC 및 HTTP 수신
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus 메트릭 scrape (기존 설정 마이그레이션)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'django'
          static_configs:
            - targets: ['web:8000']
          metrics_path: /metrics
          scrape_interval: 15s
          scrape_timeout: 10s

        - job_name: 'celery'
          static_configs:
            - targets: ['celery_worker:9808']
          metrics_path: /metrics
          scrape_interval: 15s

        - job_name: 'redis'
          static_configs:
            - targets: ['redis:9121']
          metrics_path: /metrics
          scrape_interval: 15s

        - job_name: 'postgres'
          static_configs:
            - targets: ['postgres-exporter:9187']
          metrics_path: /metrics
          scrape_interval: 15s

processors:
  # 메모리 사용량 제한
  memory_limiter:
    limit_mib: 256
    check_interval: 1s
    spike_limit_mib: 64

  # 배치 처리로 효율성 향상
  batch:
    send_batch_size: 1000
    timeout: 10s
    send_batch_max_size: 1500

  # 리소스 속성 추가
  resource:
    attributes:
      - key: service.name
        value: selfhealing
        action: upsert
      - key: deployment.environment
        value: development
        action: upsert

  # Trace 속성 민감 정보 마스킹
  attributes/traces:
    actions:
      - key: password
        action: delete
      - key: token
        action: delete
      - key: api_key
        action: delete
      - key: secret
        action: delete
      - key: authorization
        action: delete

  # 로그 속성 민감 정보 마스킹
  attributes/logs:
    actions:
      # 민감 정보 패턴 삭제
      - key: password
        action: delete
      - key: passwd
        action: delete
      - key: pwd
        action: delete
      - key: token
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: api_key
        action: delete
      - key: apikey
        action: delete
      - key: secret
        action: delete
      - key: authorization
        action: delete
      - key: auth
        action: delete
      # trace_id 추출 (로그-트레이스 연동용)
      - key: trace_id
        from_attribute: traceId
        action: upsert
      - key: span_id
        from_attribute: spanId
        action: upsert

  # 민감 정보 값 기반 마스킹 (최후의 보루) - traces 전용
  # 키 이름과 무관하게 값 패턴으로 마스킹하여 누출 방지
  # 참고: v0.96.0에서는 traces만 지원, logs/metrics는 attributes processor로 처리
  redaction:
    # 모든 키 허용 (blocked_values로만 필터링)
    allow_all_keys: true
    # 민감 값 패턴 (값 내용이 패턴에 매칭되면 마스킹)
    blocked_values:
      # 내부 IP 주소 (RFC 1918)
      - "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}"
      - "192\\.168\\.\\d{1,3}\\.\\d{1,3}"
      - "172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"
      # 서버 경로
      - "/home/[^\\s]+"
      - "/var/[^\\s]+"
      - "C:\\\\[^\\s]+"
      # Bearer 토큰
      - "Bearer\\s+[A-Za-z0-9\\-_.]+"
      # JWT 토큰 패턴 (eyJ로 시작하는 Base64 인코딩)
      - "eyJ[A-Za-z0-9\\-_]+\\.[A-Za-z0-9\\-_]+\\.[A-Za-z0-9\\-_]+"
      # API Key 패턴 (일반적인 형식)
      - "sk-[A-Za-z0-9]{20,}"
      - "pk-[A-Za-z0-9]{20,}"
    # 개발 환경에서 마스킹된 키 목록 출력
    summary: debug

exporters:
  # Tempo로 Trace 전송
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
      storage: file_storage

  # Mimir로 메트릭 전송 (Prometheus Remote Write)
  # 참고: prometheusremotewrite는 sending_queue 대신 remote_write_queue 사용
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
    remote_write_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    resource_to_telemetry_conversion:
      enabled: true

  # Loki로 로그 전송
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
      storage: file_storage
    default_labels_enabled:
      exporter: true
      job: true
      instance: true
      level: true

  # 디버그 로깅 (개발 환경용)
  debug:
    verbosity: basic

service:
  extensions: [health_check, file_storage]

  pipelines:
    # Traces 파이프라인 (Tempo로 전송)
    # redaction processor로 민감 값 마스킹 (v0.96.0에서 traces만 지원)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes/traces, redaction]
      exporters: [otlp/tempo, debug]

    # Metrics 파이프라인 (Mimir로 전송)
    # 참고: redaction은 v0.96.0에서 traces만 지원하여 미포함
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]

    # Logs 파이프라인 (Loki로 전송)
    # 참고: redaction은 v0.96.0에서 traces만 지원, attributes/logs로 키 기반 삭제 처리
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes/logs]
      exporters: [loki, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
