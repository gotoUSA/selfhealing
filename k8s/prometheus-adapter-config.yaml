# Prometheus Adapter Configuration
#
# Custom Metrics를 HPA에서 사용할 수 있도록 변환
# Django RPS(Requests Per Second) 메트릭을 Pod 스케일링에 활용
#
# 설치 방법:
#   helm install prometheus-adapter prometheus-community/prometheus-adapter \
#     --namespace monitoring \
#     --set prometheus.url=http://prometheus.monitoring.svc.cluster.local \
#     --set prometheus.port=9090
#
# ConfigMap 적용:
#   kubectl apply -f k8s/prometheus-adapter-config.yaml
#   kubectl rollout restart deployment prometheus-adapter -n monitoring

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter
  namespace: monitoring
  labels:
    app: prometheus-adapter
    component: metrics
data:
  config.yaml: |
    # External Metrics 규칙
    externalRules: []

    # Resource Metrics 규칙 (CPU, Memory)
    resourceRules:
      cpu:
        containerQuery: sum(rate(container_cpu_usage_seconds_total{<<.LabelMatchers>>}[3m])) by (<<.GroupBy>>)
        nodeQuery: sum(rate(container_cpu_usage_seconds_total{<<.LabelMatchers>>, id='/'}[3m])) by (<<.GroupBy>>)
        resources:
          overrides:
            node:
              resource: node
            namespace:
              resource: namespace
            pod:
              resource: pod
        containerLabel: container
      memory:
        containerQuery: sum(container_memory_working_set_bytes{<<.LabelMatchers>>}) by (<<.GroupBy>>)
        nodeQuery: sum(container_memory_working_set_bytes{<<.LabelMatchers>>,id='/'}) by (<<.GroupBy>>)
        resources:
          overrides:
            node:
              resource: node
            namespace:
              resource: namespace
            pod:
              resource: pod
        containerLabel: container
      window: 3m

    # Custom Metrics 규칙
    rules:
      # Django HTTP Requests Per Second
      # django_http_requests_total -> django_http_requests_per_second
      - seriesQuery: 'django_http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
            pod:
              resource: "pod"
        name:
          matches: "^(.*)_total$"
          as: "${1}_per_second"
        metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'

      # Nginx Ingress Controller Requests Per Second
      # nginx_ingress_controller_requests -> requests_per_second
      - seriesQuery: 'nginx_ingress_controller_requests{namespace!=""}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
            ingress:
              resource: "ingress"
        name:
          as: "requests_per_second"
        metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'

      # Celery Queue Length
      # Redis list length를 Prometheus 메트릭으로 노출한 경우
      - seriesQuery: 'redis_list_length{key=~"celery|critical|audit_flush"}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
        name:
          as: "celery_queue_length"
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

      # Django Response Time P95
      # HTTP 응답 시간 95백분위
      - seriesQuery: 'django_http_request_duration_seconds_bucket{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
            pod:
              resource: "pod"
        name:
          as: "http_request_duration_p95"
        metricsQuery: 'histogram_quantile(0.95, sum(rate(<<.Series>>{<<.LabelMatchers>>}[5m])) by (<<.GroupBy>>, le))'
