# Kafka MirrorMaker 2 Configuration
# 멀티 리전 복제를 위한 설정 파일
#
# 사용법:
#   1. 이 파일을 Kafka Connect 클러스터에 배포
#   2. Connect REST API로 커넥터 등록
#   3. 또는 Kubernetes에서 Strimzi Operator 사용
#
# 참고: https://strimzi.io/docs/operators/latest/configuring.html#assembly-mirrormaker-str
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: selfhealing-audit-mirror
  namespace: kafka
  labels:
    app: selfhealing-audit
    component: mirrormaker2
spec:
  version: 3.6.0
  replicas: 2
  connectCluster: "global"

  # 클러스터 정의
  clusters:
    # 소스 클러스터 (서울 리전)
    - alias: seoul
      bootstrapServers: kafka-seoul-bootstrap.kafka.svc:9092
      config:
        # 연결 설정
        config.storage.replication.factor: 3
        offset.storage.replication.factor: 3
        status.storage.replication.factor: 3
      authentication:
        type: scram-sha-512
        username: mirror-user
        passwordSecret:
          secretName: kafka-seoul-credentials
          password: password
      tls:
        trustedCertificates:
          - secretName: kafka-seoul-ca
            certificate: ca.crt

    # 대상 클러스터 (글로벌 허브)
    - alias: global
      bootstrapServers: kafka-global-bootstrap.kafka.svc:9092
      config:
        config.storage.replication.factor: 3
        offset.storage.replication.factor: 3
        status.storage.replication.factor: 3
      authentication:
        type: scram-sha-512
        username: mirror-user
        passwordSecret:
          secretName: kafka-global-credentials
          password: password
      tls:
        trustedCertificates:
          - secretName: kafka-global-ca
            certificate: ca.crt

  # 복제 설정
  mirrors:
    # Seoul → Global 복제
    - sourceCluster: seoul
      targetCluster: global
      sourceConnector:
        config:
          # 복제 대상 토픽 패턴
          replication.factor: 3
          offset-syncs.topic.replication.factor: 3
          heartbeats.topic.replication.factor: 3
          checkpoints.topic.replication.factor: 3
          # 처리량 설정
          sync.topic.acls.enabled: "false"
          refresh.topics.interval.seconds: 60
          # 오프셋 동기화
          offset.lag.max: 100
        tasksMax: 4
      checkpointConnector:
        config:
          checkpoints.topic.replication.factor: 3
          sync.group.offsets.enabled: "true"
          sync.group.offsets.interval.seconds: 60
          emit.checkpoints.interval.seconds: 60
        tasksMax: 1
      heartbeatConnector:
        config:
          heartbeats.topic.replication.factor: 3
          emit.heartbeats.interval.seconds: 10
        tasksMax: 1
      topicsPattern: "selfhealing\\.(audit|routing)\\..*"
      groupsPattern: "audit-.*"

  # 리소스 설정
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m

  # 로깅 설정
  logging:
    type: inline
    loggers:
      connect.root.logger.level: INFO
      log4j.logger.org.apache.kafka.connect.mirror: DEBUG

  # 메트릭 설정 (Prometheus)
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: mirrormaker-metrics
        key: metrics-config.yaml

  # 트레이싱 설정 (OpenTelemetry)
  tracing:
    type: opentelemetry

---
# MirrorMaker 메트릭 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: mirrormaker-metrics
  namespace: kafka
data:
  metrics-config.yaml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      # MirrorMaker 2 복제 메트릭
      - pattern: "kafka.connect.mirror<type=MirrorSourceConnector, target=(.+), topic=(.+), partition=(.+)><>(.+)"
        name: "kafka_connect_mirror_source_connector_$4"
        labels:
          target: "$1"
          topic: "$2"
          partition: "$3"

      - pattern: "kafka.connect.mirror<type=MirrorCheckpointConnector, source=(.+), target=(.+)><>(.+)"
        name: "kafka_connect_mirror_checkpoint_connector_$3"
        labels:
          source: "$1"
          target: "$2"

      # 복제 지연 메트릭
      - pattern: "kafka.connect.mirror<type=MirrorSourceConnector, target=(.+), topic=(.+), partition=(.+)><>replication-latency-ms-avg"
        name: "kafka_mirror_replication_latency_ms_avg"
        labels:
          target: "$1"
          topic: "$2"
          partition: "$3"

      - pattern: "kafka.connect.mirror<type=MirrorSourceConnector, target=(.+), topic=(.+), partition=(.+)><>record-count"
        name: "kafka_mirror_record_count"
        labels:
          target: "$1"
          topic: "$2"
          partition: "$3"

---
# Kafka Connect 클러스터 (MirrorMaker 2 용)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: selfhealing-mirror-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 3.6.0
  replicas: 3
  bootstrapServers: kafka-global-bootstrap.kafka.svc:9092
  config:
    group.id: selfhealing-mirror-connect
    offset.storage.topic: selfhealing-mirror-connect-offsets
    config.storage.topic: selfhealing-mirror-connect-configs
    status.storage.topic: selfhealing-mirror-connect-status
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
    # 장애 복구 설정
    offset.flush.interval.ms: 10000
    offset.flush.timeout.ms: 5000
    # 재시도 설정
    errors.retry.delay.max.ms: 60000
    errors.retry.timeout: 0
    errors.tolerance: all
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m
