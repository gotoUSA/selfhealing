# Load Test Runner Configuration
# ===============================
# Stage-based test settings and execution profile definitions

stages:
  stage0_smoke:
    file: scenarios/stage0_smoke.py
    users: 5
    spawn_rate: 5
    duration: "30s"
    tags: ["smoke", "baseline"]
    required: true  # Abort subsequent stages on failure
    description: "Environment/Login/Basic flow verification"

  stage1_happy:
    file: scenarios/stage1_happy_load.py
    users: 100
    spawn_rate: 20
    duration: "3m"
    tags: ["load", "performance"]
    description: "Normal performance measurement (Baseline)"

  stage2_idempotent:
    file: scenarios/stage2_idempotent.py
    users: 30
    spawn_rate: 10
    duration: "2m"
    tags: ["idempotency", "critical"]
    description: "Duplicate payment prevention verification"

  stage3_latency:
    file: scenarios/stage3_latency.py
    users: 50
    spawn_rate: 10
    duration: "3m"
    tags: ["chaos", "latency"]
    env:
      CHAOS_ENABLED: "true"
      CHAOS_LATENCY_MIN_MS: "500"
      CHAOS_LATENCY_MAX_MS: "3000"
    description: "PG latency/timeout simulation"

  stage4_cancel:
    file: scenarios/stage4_cancel_storm.py
    users: 50
    spawn_rate: 20
    duration: "2m"
    tags: ["cancel", "stress"]
    description: "Post-payment cancel storm"

  stage5_rollback:
    file: scenarios/stage5_rollback.py
    users: 30
    spawn_rate: 10
    duration: "3m"
    tags: ["rollback", "validation"]
    description: "Stock/Point recovery verification"

  stage6_chaos:
    file: scenarios/stage6_chaos_random.py
    users: 100
    spawn_rate: 20
    duration: "5m"
    tags: ["chaos", "random"]
    env:
      CHAOS_ENABLED: "true"
      CHAOS_PROBABILITY: "0.10"
    description: "3~15% random failures"

  stage7_race:
    file: scenarios/stage7_race_conflict.py
    users: 50
    spawn_rate: 50  # Fast spawn for maximum concurrency
    duration: "2m"
    tags: ["race", "concurrency"]
    description: "Same order concurrent payments"

  stage8_webhook:
    file: scenarios/stage8_webhook.py
    users: 30
    spawn_rate: 10
    duration: "3m"
    tags: ["webhook", "reliability"]
    description: "Webhook duplication/order reversal/latency"

  stage9_soak:
    file: scenarios/stage9_soak.py
    users: 100
    spawn_rate: 10
    duration: "30m"
    tags: ["soak", "endurance"]
    optional: true  # Can skip in CI
    description: "Memory leak, connection pool exhaustion detection"

  stage10_self_healing:
    file: scenarios/stage10_self_healing.py
    users: 50
    spawn_rate: 5
    duration: "3m"
    tags: ["self-healing", "control-api"]
    description: "Self-Healing Control API functionality verification"

  stage11_ramp_threshold:
    file: scenarios/stage11_ramp_threshold.py
    users: 300
    spawn_rate: 0.25
    duration: "20m"
    tags: ["self-healing", "threshold", "ramp"]
    optional: true
    description: "System threshold and Self-Healing trigger point discovery"

  stage12_spike_recovery:
    file: scenarios/stage12_spike_recovery.py
    users: 500
    spawn_rate: 50
    duration: "10m30s"
    tags: ["self-healing", "spike", "recovery"]
    description: "Sudden load spike recovery stability verification"

  stage13_repeated_spike:
    file: scenarios/stage13_repeated_spike.py
    users: 500
    spawn_rate: 50
    duration: "13m30s"
    tags: ["self-healing", "backoff", "repeated"]
    optional: true
    description: "Repeated spike backoff accumulation prevention verification"

  stage14_dlq_replay:
    file: scenarios/stage14_dlq_replay.py
    users: 50
    spawn_rate: 10
    duration: "5m"
    tags: ["self-healing", "dlq", "replay"]
    description: "DLQ replay accuracy and data consistency verification"

  stage15_cb_transitions:
    file: scenarios/stage15_cb_transitions.py
    users: 20
    spawn_rate: 5
    duration: "5m"
    tags: ["self-healing", "circuit-breaker", "transitions"]
    description: "Circuit Breaker auto state transition verification"

# Execution profiles
profiles:
  smoke:
    stages:
      - stage0_smoke
    description: "Basic environment verification only"

  quick:
    stages:
      - stage0_smoke
      - stage1_happy
      - stage2_idempotent
    description: "Quick verification (~5 minutes)"

  standard:
    stages:
      - stage0_smoke
      - stage1_happy
      - stage2_idempotent
      - stage3_latency
      - stage4_cancel
      - stage5_rollback
    description: "Standard test (~15 minutes)"

  full:
    stages:
      - stage0_smoke
      - stage1_happy
      - stage2_idempotent
      - stage3_latency
      - stage4_cancel
      - stage5_rollback
      - stage6_chaos
      - stage7_race
    description: "Full test (excludes Soak, ~25 minutes)"

  chaos:
    stages:
      - stage6_chaos
      - stage7_race
    description: "Chaos tests only"

  critical:
    stages:
      - stage0_smoke
      - stage2_idempotent
      - stage5_rollback
      - stage7_race
    description: "Data integrity tests only"

  self_healing:
    stages:
      - stage0_smoke
      - stage10_self_healing
      - stage11_ramp_threshold
      - stage12_spike_recovery
      - stage13_repeated_spike
      - stage14_dlq_replay
      - stage15_cb_transitions
    description: "Full Self-Healing test (~60 minutes)"

  self_healing_quick:
    stages:
      - stage0_smoke
      - stage10_self_healing
      - stage14_dlq_replay
      - stage15_cb_transitions
    description: "Quick Self-Healing test (~15 minutes)"

  all:
    stages:
      - stage0_smoke
      - stage1_happy
      - stage2_idempotent
      - stage3_latency
      - stage4_cancel
      - stage5_rollback
      - stage6_chaos
      - stage7_race
      - stage8_webhook
      - stage9_soak
    description: "Full test (includes Soak)"

# Common settings
defaults:
  host: "http://localhost:8000"
  docker_host: "http://web:8000"
  html_report: true
  csv_report: false
  report_dir: "reports"
  headless: true

# Scaling test settings
scaling:
  stage1_happy:
    user_levels: [50, 100, 200, 300]
    duration_per_level: "2m"

# Environment Configuration (Setup)
# Settings applied when using --setup option
setup:
  # Load test user settings
  users:
    count: 1000          # Number of users to create
    points: 50000        # Initial points
    clear: true          # Clear existing users before creation

  # Test product settings
  products:
    preset: "full"       # minimal, basic, full
    clear: false         # Products are preserved by default

  # Auto configuration
  auto_migrate: true     # Auto-run migrations
  reset_orders: true     # Clean up existing order data
