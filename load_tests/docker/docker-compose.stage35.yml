# Stage 35: Cache Stampede Prevention Test
# Docker Compose 설정
#
# 사용법:
#   # Redis 분산 락 테스트 (핵심)
#   docker-compose -f docker-compose.stage35.yml run --rm stampede-test-redis
#
#   # 시뮬레이션 테스트 (로직 검증)
#   docker-compose -f docker-compose.stage35.yml run --rm stampede-test-sim
#
#   # 멀티 워커 동시 테스트
#   docker-compose -f docker-compose.stage35.yml up --scale stampede-worker=4
#
# 테스트 시나리오:
#   SC-35-1: Hot Key Expiry Stampede
#   SC-35-2: Probabilistic Early Expiration
#   SC-35-3: Multi-Key Batch Expiry

services:
  # Redis (분산 락 + 캐시)
  redis:
    image: redis:7-alpine
    container_name: redis-stage35
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "6379:6379"
    networks:
      - stampede_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    labels:
      - "stage=35"

  # Redis 분산 락 테스트 (메인 테스트)
  stampede-test-redis:
    image: python:3.12-slim
    container_name: stampede-test-redis
    working_dir: /code
    command: >
      sh -c "pip install redis -q &&
             python load_tests/scenarios/stage35_redis_stampede.py"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - WORKER_ID=main-test
    volumes:
      - .:/code
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stampede_net
    labels:
      - "stage=35"
      - "test=redis"

  # 시뮬레이션 테스트 (in-memory, 알고리즘 검증)
  stampede-test-sim:
    image: python:3.12-slim
    container_name: stampede-test-sim
    working_dir: /code
    command: python load_tests/run_stage35_full_test.py
    volumes:
      - .:/code
    networks:
      - stampede_net
    labels:
      - "stage=35"
      - "test=simulation"

  # 멀티 워커 테스트 (분산 환경 검증)
  stampede-worker:
    image: python:3.12-slim
    working_dir: /code
    command: >
      sh -c "pip install redis -q &&
             sleep 2 &&
             python load_tests/scenarios/stage35_redis_stampede.py"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - .:/code
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stampede_net
    labels:
      - "stage=35"
      - "test=multi-worker"

networks:
  stampede_net:
    driver: bridge
    name: stage35_network
