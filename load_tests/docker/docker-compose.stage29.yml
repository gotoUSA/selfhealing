# Stage 29: Bulk DLQ Replay Test
# Docker Compose 설정
#
# 사용법:
#   docker-compose -f docker-compose.stage29.yml up -d
#   docker-compose -f docker-compose.stage29.yml -f docker-compose.yml up -d
#
# 대량 DLQ 재처리 테스트 환경

services:
  # 메인 웹 애플리케이션
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-stage29
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn myproject.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_HOST=db
      - TEST_DATABASE_NAME=myproject
      - TEST_DATABASE_USER=postgres
      - TEST_DATABASE_PASSWORD=postgres
      - TEST_DATABASE_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DLQ_BATCH_SIZE=1000
      - DLQ_MAX_RETRIES=3
      - DLQ_THROTTLE_TPS=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - stage29_network
    labels:
      - "stage=29"
    deploy:
      resources:
        limits:
          memory: 1G  # 메모리 제한 1GB
        reservations:
          memory: 512M

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: db-stage29
    environment:
      - POSTGRES_DB=myproject
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_stage29_data:/var/lib/postgresql/data
    networks:
      - stage29_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Cache and Celery Broker
  redis:
    image: redis:7-alpine
    container_name: redis-stage29
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - stage29_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for DLQ Processing
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Note: container_name removed to allow replicas
    command: celery -A myproject worker -l INFO -c 4
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_HOST=db
      - TEST_DATABASE_NAME=myproject
      - TEST_DATABASE_USER=postgres
      - TEST_DATABASE_PASSWORD=postgres
      - TEST_DATABASE_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DLQ_BATCH_SIZE=1000
      - DLQ_MAX_RETRIES=3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stage29_network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # DLQ Replay Worker (별도 프로세스)
  dlq-replay-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlq-replay-stage29
    command: python manage.py run_dlq_replay --batch-size=1000 --throttle-tps=1000
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_HOST=db
      - TEST_DATABASE_NAME=myproject
      - TEST_DATABASE_USER=postgres
      - TEST_DATABASE_PASSWORD=postgres
      - TEST_DATABASE_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - stage29_network
    deploy:
      resources:
        limits:
          memory: 1G

  # Locust Load Tester
  locust:
    image: locustio/locust:2.20.0
    container_name: locust-stage29
    ports:
      - "8089:8089"
    volumes:
      - ./load_tests:/mnt/locust
    command: >
      -f /mnt/locust/scenarios/stage29_bulk_dlq_replay.py
      --host=http://web:8000
      --master
    networks:
      - stage29_network
    depends_on:
      - web

  # Locust Workers
  locust-worker:
    image: locustio/locust:2.20.0
    volumes:
      - ./load_tests:/mnt/locust
    command: >
      -f /mnt/locust/scenarios/stage29_bulk_dlq_replay.py
      --worker
      --master-host=locust
    networks:
      - stage29_network
    depends_on:
      - locust
    deploy:
      replicas: 4

  # Redis Commander (모니터링)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-stage29
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - stage29_network
    depends_on:
      - redis

  # Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-stage29
    volumes:
      - ./scripts/prometheus-stage29.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - stage29_network

networks:
  stage29_network:
    driver: bridge
    name: stage29_network

volumes:
  db_stage29_data:
