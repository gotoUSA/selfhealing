# Docker Compose Override for Stage 27 Load Test
services:
  locust-master:
    command: >
      locust -f /code/load_tests/scenarios/stage27_graceful_shutdown.py
      --master
      --host=http://web:8000
      --users=100
      --spawn-rate=20
      --run-time=2m
      --headless
      --html=/code/reports/stage27_locust_report.html

  locust-worker:
    command: >
      locust -f /code/load_tests/scenarios/stage27_graceful_shutdown.py
      --worker
      --master-host=locust-master
