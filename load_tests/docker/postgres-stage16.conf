# =============================================================================
# PostgreSQL Configuration for Stage 16 HEALING PROOF Test
# =============================================================================
# 이 설정은 Advisory Lock 경합 및 빠른 타임아웃 감지를 위해 최적화되어 있습니다.
# =============================================================================

# 연결 설정
max_connections = 200
shared_buffers = 256MB

# 락 관련 설정 (핵심!)
lock_timeout = 5s                    # 기본 락 타임아웃 (테스트에서 1ms로 오버라이드)
deadlock_timeout = 1s                # 데드락 감지 타임아웃
statement_timeout = 30s              # 쿼리 타임아웃

# 락 로깅 (디버깅용)
log_lock_waits = on                  # 락 대기 로깅
log_statement = all                  # 모든 SQL 로깅
log_duration = on                    # 쿼리 소요 시간 로깅

# WAL 설정
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10

# 메모리 설정
work_mem = 64MB
maintenance_work_mem = 128MB
effective_cache_size = 512MB

# 체크포인트
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# 로깅
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# 통계
track_activities = on
track_counts = on
track_functions = all
track_io_timing = on
