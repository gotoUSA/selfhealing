# =============================================================================
# Stage 16 v6.0.0: HEALING PROOF - Docker Compose Test Environment
# =============================================================================
#
# 목적: "폭풍 전야 → 시스템 붕괴 → 자율 복구" 시나리오 테스트
#
# 사용법:
#   docker-compose -f docker-compose.stage16.yml up --build
#
# 테스트 실행:
#   docker-compose -f docker-compose.stage16.yml run --rm test-healing-proof
#
# 정리:
#   docker-compose -f docker-compose.stage16.yml down -v
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Advisory Lock 테스트용 설정
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shopping_user
      POSTGRES_PASSWORD: shopping_pass
      POSTGRES_DB: shopping_db
      # 🔥 Stage16 최적화: 락 관련 설정
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"  # 호스트 5433 → 컨테이너 5432
    volumes:
      - stage16_postgres_data:/var/lib/postgresql/data
      # 커스텀 PostgreSQL 설정
      - ./load_tests/docker/postgres-stage16.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=256MB
      -c lock_timeout=5s
      -c statement_timeout=30s
      -c log_lock_waits=on
      -c deadlock_timeout=1s
      -c log_statement=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_user -d shopping_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis - Circuit Breaker 상태 및 DLQ 저장
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - stage16_redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Django Application - Self-Healing Enabled
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - stage16_static:/code/staticfiles
      - stage16_media:/code/media
    working_dir: /code
    environment:
      # Django 설정
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      
      # Database
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - USE_CONNECTION_POOL=TRUE
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      
      # 🔥 Self-Healing 활성화
      - SELFHEALING_ENABLED=true
      - ENABLE_STRESS_TESTS=true
      - DEBUG=true
      - DISABLE_RATE_LIMITING=TRUE
      - DISABLE_SELFHEALING_AUTH=true  # 테스트 환경에서 인증 비활성화
      
      # 🔥 Stage16 특수 설정
      - STAGE16_ADVISORY_LOCK_ENABLED=true
      - SELFHEALING_CB_FAILURE_THRESHOLD=5
      - SELFHEALING_CB_RECOVERY_TIMEOUT=10
      - SELFHEALING_DLQ_AUTO_ENQUEUE=true
    command: >
      sh -c "
        pip install -e /code/packages/selfhealing-python &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/self-healing/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Celery Worker - DLQ Replay 처리
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SELFHEALING_ENABLED=true
    command: >
      sh -c "
        pip install -e /code/packages/selfhealing-python &&
        celery -A myproject worker -l info -Q default,selfhealing,dlq
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Stage 16 Healing Proof v6 Test Runner
  # ---------------------------------------------------------------------------
  test-healing-proof:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/code
      - ./load_tests/results/stage16:/code/load_tests/results/stage16
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - BASE_URL=http://web:8000
    command: >
      sh -c "
        echo '🔥 Stage 16 v6.0.0: HEALING PROOF Test Starting...' &&
        pip install requests -q &&
        python /code/load_tests/scenarios/chaos/stage16_healing_proof_v6.py --base-url=http://web:8000 --output-dir=/code/load_tests/results/stage16 --calm-duration=30
      "
    depends_on:
      web:
        condition: service_healthy
      celery-worker:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Locust Load Test (Optional - HELLMODE)
  # ---------------------------------------------------------------------------
  locust:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    volumes:
      - .:/code
      - ./load_tests/results/stage16:/code/load_tests/results/stage16
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        pip install locust -q &&
        locust -f /code/load_tests/scenarios/chaos/stage16_db_lock_recovery_locust.py \
          --host http://web:8000 \
          --web-host 0.0.0.0
      "
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - locust  # 명시적으로 실행할 때만: docker-compose --profile locust up

  # ---------------------------------------------------------------------------
  # Advisory Lock Holder (Lock Hog Daemon)
  # ---------------------------------------------------------------------------
  lock-hog:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
    command: ["python", "/code/scripts/lock_hog.py"]
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - lock-hog

volumes:
  stage16_postgres_data:
  stage16_redis_data:
  stage16_static:
  stage16_media:

networks:
  default:
    name: stage16_network
