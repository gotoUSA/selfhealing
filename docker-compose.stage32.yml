# Stage 32: Retry Storm Extended Test
# Docker Compose 설정
#
# 사용법:
#   docker-compose -f docker-compose.stage32.yml up -d
#   docker-compose -f docker-compose.stage32.yml -f docker-compose.yml up -d
#
# 테스트 시나리오:
#   1. Memory Leak During Backoff
#   2. DLQ Not Exploding
#   3. Payment Webhook Replay Safety
#   4. Retry Timestamp Skew Compound

version: '3.8'

services:
  # 웹 애플리케이션 (메모리 모니터링 활성화)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-stage32
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://postgres:postgres@db:5432/myproject
      - REDIS_URL=redis://redis:6379/0
      - STAGE=32
      - RETRY_STORM_TEST_ENABLED=true
      - DLQ_MAX_SIZE=10000
      - DLQ_MAX_INPUT_RATE=500
      - CLOCK_SKEW_TOLERANCE_S=30
      - PYTHONTRACEMALLOC=1
      - MEMORY_LIMIT_MB=500
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - retry_net
    mem_limit: 512m
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "stage=32"
      - "test=retry-storm-extended"

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: db-stage32
    environment:
      - POSTGRES_DB=myproject
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_stage32_data:/var/lib/postgresql/data
    networks:
      - retry_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시 (DLQ 저장소로도 사용)
  redis:
    image: redis:7-alpine
    container_name: redis-stage32
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - retry_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ (DLQ 테스트용)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-stage32
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - retry_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Locust 부하 테스트 (고부하)
  locust-master:
    image: locustio/locust:2.20.0
    container_name: locust-master-stage32
    ports:
      - "8089:8089"
    volumes:
      - ./load_tests:/mnt/locust
    environment:
      - LOCUST_HOST=http://web:8000
      - LOCUST_LOCUSTFILE=/mnt/locust/scenarios/stage32_retry_storm_extended.py
      - LOCUST_TEST_DURATION=60
    command: >
      -f /mnt/locust/scenarios/stage32_retry_storm_extended.py
      --master
      --host=http://web:8000
    depends_on:
      - web
    networks:
      - retry_net

  locust-worker:
    image: locustio/locust:2.20.0
    volumes:
      - ./load_tests:/mnt/locust
    environment:
      - LOCUST_HOST=http://web:8000
      - LOCUST_LOCUSTFILE=/mnt/locust/scenarios/stage32_retry_storm_extended.py
    command: >
      -f /mnt/locust/scenarios/stage32_retry_storm_extended.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    deploy:
      replicas: 3
    networks:
      - retry_net

  # Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-stage32
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus-stage32.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - retry_net
    profiles:
      - monitoring

  # Grafana (시각화)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-stage32
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_stage32_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - retry_net
    profiles:
      - monitoring

networks:
  retry_net:
    driver: bridge
    name: stage32_retry_net

volumes:
  db_stage32_data:
    name: stage32_db_data
  grafana_stage32_data:
    name: stage32_grafana_data
