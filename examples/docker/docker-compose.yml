# Phase 1: Minimal infrastructure sandbox for selfhealing integration
#
# Usage: docker-compose up -d
# Connect your app with:
#   DATABASE_URL=postgres://selfhealing_user:selfhealing_pass@localhost:5432/selfhealing_db
#   REDIS_URL=redis://localhost:6379/0
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#   OTEL_TRACES_SAMPLER=always_on
#
# Consumer app (Django/Celery) is NOT included.
# Run your own app locally and point it at this infrastructure.

services:
  # Redis — Cache / Celery Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL — Database
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=selfhealing_db
      - POSTGRES_USER=selfhealing_user
      - POSTGRES_PASSWORD=selfhealing_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhealing_user -d selfhealing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector — telemetry collection
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.144.0
    command: ["--config=/etc/otelcol/otel-collector.yml"]
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otelcol/otel-collector.yml:ro
      - otel_buffer:/var/lib/otelcol/buffer
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
      - "13133:13133" # Health check
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # Grafana Tempo — distributed tracing storage
  tempo:
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "9095:9095"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Grafana Mimir — metrics long-term storage
  mimir:
    image: grafana/mimir:2.11.0
    command: ["-config.file=/etc/mimir/mimir.yml"]
    volumes:
      - ./config/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir_data:/var/mimir
    ports:
      - "9009:9009"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9009/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Grafana Loki — log storage
  loki:
    image: grafana/loki:2.9.4
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/var/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Grafana — dashboards (pre-provisioned)
  grafana:
    image: grafana/grafana:10.2.3
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/selfhealing.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - mimir
      - tempo
      - loki

volumes:
  postgres_data:
  otel_buffer:
  tempo_data:
  mimir_data:
  loki_data:
  grafana_data:
