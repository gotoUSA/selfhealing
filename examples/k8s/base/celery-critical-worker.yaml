# Celery Critical Worker Deployment (P0 tasks)
#
# Dedicated worker for Recovery, Emergency, and CircuitBreaker tasks.
# Separated from default workers to guarantee priority processing.
#
# Hardening applied (per doc 325 section 5.4):
#   - Image tag: placeholder v0.0.0
#   - Namespace: removed from base
#   - securityContext: runAsNonRoot, drop ALL capabilities

apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-critical-worker
  labels:
    app: celery-critical-worker
    component: selfhealing
    tier: worker
    priority: p0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-critical-worker
  template:
    metadata:
      labels:
        app: celery-critical-worker
        component: selfhealing
        priority: p0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: priority
                      operator: In
                      values:
                        - p0
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      priorityClassName: high-priority

      terminationGracePeriodSeconds: 300

      containers:
        - name: worker
          image: myproject:v0.0.0
          command:
            - celery
            - -A
            - myproject
            - worker
            - --loglevel=info
            - -Q
            - selfhealing.critical
            - --prefetch-multiplier=1
            - -c
            - "2"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          env:
            - name: CELERY_WORKER_POOL
              value: "prefork"
            - name: CELERY_WORKER_HIJACK_ROOT_LOGGER
              value: "false"
            - name: CELERY_WORKER_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: celery-broker-url
            - name: DJANGO_SETTINGS_MODULE
              value: "myproject.settings.production"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"

          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - myproject
                - inspect
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10

          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - myproject
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    python -c "
                    from selfhealing.services.coordination.recovery_shutdown import (
                        RecoveryAwareShutdownHook,
                    )
                    hook = RecoveryAwareShutdownHook()
                    hook.wait_for_safe_shutdown(max_wait_seconds=300)
                    "
