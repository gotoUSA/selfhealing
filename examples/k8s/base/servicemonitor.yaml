# Prometheus ServiceMonitor for selfhealing pods
#
# Requires: Prometheus Operator installed in the cluster.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: selfhealing
  labels:
    app: selfhealing
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: selfhealing
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
