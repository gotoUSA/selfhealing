# Self-Healing Prometheus Alert Rules
#
# Import into your Prometheus configuration:
#   rule_files:
#     - "selfhealing-alerts.yml"

groups:
  # =========================================================================
  # DLQ (Dead Letter Queue) Alerts
  # =========================================================================
  - name: dlq_alerts
    interval: 30s
    rules:
      - alert: DLQHighPendingCount
        expr: sum(selfhealing_dlq_pending_count) > 50
        for: 5m
        labels:
          severity: warning
          category: dlq
        annotations:
          summary: "DLQ pending count elevated"
          description: "DLQ has {{ $value }} pending items. (threshold: 50)"
          runbook_url: "https://docs.example.com/runbooks/dlq-high-pending"
          dashboard_url: "/d/dlq-monitoring/dlq-monitoring"

      - alert: DLQCriticalPendingCount
        expr: sum(selfhealing_dlq_pending_count) > 100
        for: 3m
        labels:
          severity: critical
          category: dlq
        annotations:
          summary: "DLQ pending count critical"
          description: "DLQ has {{ $value }} pending items. Immediate investigation required."
          runbook_url: "https://docs.example.com/runbooks/dlq-critical"
          dashboard_url: "/d/dlq-monitoring/dlq-monitoring"

      - alert: DLQSpikeDetected
        expr: |
          (
            sum(selfhealing_dlq_pending_count)
            /
            sum(selfhealing_dlq_pending_count offset 5m)
          ) > 2
        for: 2m
        labels:
          severity: warning
          category: dlq
        annotations:
          summary: "DLQ spike detected"
          description: "DLQ pending items increased {{ $value | printf \"%.1f\" }}x in 5 minutes."

  # =========================================================================
  # Circuit Breaker Alerts
  # =========================================================================
  - name: circuit_breaker_alerts
    interval: 15s
    rules:
      - alert: CircuitBreakerOpen
        expr: selfhealing_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
          category: circuit_breaker
        annotations:
          summary: "Circuit Breaker OPEN"
          description: "{{ $labels.service }} Circuit Breaker is in OPEN state. Possible external service failure."
          runbook_url: "https://docs.example.com/runbooks/circuit-breaker-open"
          dashboard_url: "/d/self-healing-overview/self-healing-overview"

      - alert: CircuitBreakerHalfOpen
        expr: selfhealing_circuit_breaker_state == 2
        for: 5m
        labels:
          severity: warning
          category: circuit_breaker
        annotations:
          summary: "Circuit Breaker Half-Open for 5+ minutes"
          description: "{{ $labels.service }} has been in Half-Open state for over 5 minutes."

      - alert: CircuitBreakerHighFailureRate
        expr: |
          (
            sum(rate(selfhealing_circuit_breaker_failure_total[5m])) by (service)
            /
            (
              sum(rate(selfhealing_circuit_breaker_success_total[5m])) by (service)
              +
              sum(rate(selfhealing_circuit_breaker_failure_total[5m])) by (service)
            )
          ) > 0.3
        for: 3m
        labels:
          severity: warning
          category: circuit_breaker
        annotations:
          summary: "Circuit Breaker failure rate high"
          description: "{{ $labels.service }} failure rate is {{ $value | printf \"%.1f\" }}%. (threshold: 30%)"

  # =========================================================================
  # Tiering Circuit Breaker Alerts
  # =========================================================================
  - name: tiering_circuit_breaker_alerts
    interval: 30s
    rules:
      - alert: TieringCircuitBreakerRepeated
        expr: |
          increase(selfhealing_tiering_circuit_open[10m]) > 3
        for: 1m
        labels:
          severity: warning
          category: tiering
        annotations:
          summary: "Tiering Circuit Breaker repeated OPEN"
          description: "Tiering CB opened {{ $value | printf \"%.0f\" }} times in 10 minutes."
          runbook_url: "https://docs.example.com/runbooks/tiering-cb-repeated"

      - alert: TieringCircuitBreakerStuck
        expr: selfhealing_tiering_circuit_open == 1
        for: 5m
        labels:
          severity: critical
          category: tiering
        annotations:
          summary: "Tiering Circuit Breaker stuck OPEN"
          description: "Tiering CB has been OPEN for 5+ minutes. Auto-recovery failed."
          runbook_url: "https://docs.example.com/runbooks/tiering-cb-stuck"

  # =========================================================================
  # Retry Alerts
  # =========================================================================
  - name: retry_alerts
    interval: 30s
    rules:
      - alert: RetrySuccessRateLow
        expr: |
          (
            sum(rate(selfhealing_retry_success_total[5m])) by (domain)
            /
            sum(rate(selfhealing_retry_total[5m])) by (domain)
          ) < 0.8
        for: 5m
        labels:
          severity: warning
          category: retry
        annotations:
          summary: "Retry success rate low"
          description: "{{ $labels.domain }} retry success rate is {{ $value | printf \"%.1f\" }}%. (threshold: 80%)"

      - alert: RetryRateHigh
        expr: sum(rate(selfhealing_retry_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: retry
        annotations:
          summary: "Retry rate high"
          description: "{{ $value | printf \"%.2f\" }} retries/sec observed."

  # =========================================================================
  # SLO / Error Budget Alerts
  # =========================================================================
  - name: slo_alerts
    interval: 1m
    rules:
      - alert: SLOAvailabilityViolation
        expr: |
          (
            1 - (
              sum(rate(selfhealing_dlq_items_total[30d]))
              /
              sum(rate(selfhealing_requests_total[30d]))
            )
          ) < 0.999
        for: 5m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "SLO violation: availability"
          description: "30-day availability is {{ $value | printf \"%.4f\" }}. SLO target: 99.9%"
          dashboard_url: "/d/error-budget/error-budget"

      - alert: ErrorBudgetCritical
        expr: |
          100 * (
            1 - (
              sum(increase(selfhealing_dlq_items_total[30d]))
              /
              (sum(increase(selfhealing_requests_total[30d])) * 0.001)
            )
          ) < 25
        for: 10m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Error budget critical"
          description: "Error budget remaining: {{ $value | printf \"%.1f\" }}%. Deploy freeze recommended."
          dashboard_url: "/d/error-budget/error-budget"

      - alert: ErrorBudgetWarning
        expr: |
          100 * (
            1 - (
              sum(increase(selfhealing_dlq_items_total[30d]))
              /
              (sum(increase(selfhealing_requests_total[30d])) * 0.001)
            )
          ) < 50
        for: 10m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "Error budget warning"
          description: "Error budget remaining: {{ $value | printf \"%.1f\" }}%."

      - alert: ErrorBudgetFastBurn
        expr: |
          (
            (sum(rate(selfhealing_dlq_items_total[1h])) / sum(rate(selfhealing_requests_total[1h])))
            / 0.001 * 720
          ) > 14.4
        for: 5m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Error budget fast burn"
          description: "1-hour burn rate is {{ $value | printf \"%.1f\" }}. Consuming >2% error budget per hour."

      - alert: ErrorBudgetSlowBurn
        expr: |
          (
            (sum(rate(selfhealing_dlq_items_total[6h])) / sum(rate(selfhealing_requests_total[6h])))
            / 0.001 * 720
          ) > 3
        for: 30m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "Error budget slow burn"
          description: "6-hour burn rate is {{ $value | printf \"%.1f\" }}."

  # =========================================================================
  # Latency SLA Alerts
  # =========================================================================
  - name: latency_sla_alerts
    interval: 15s
    rules:
      - alert: LatencyP95SlaCritical
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
          ) * 1000 > 500
        for: 1m
        labels:
          severity: critical
          category: sla
        annotations:
          summary: "SLA Critical: P95 Latency exceeded"
          description: "{{ $labels.service_name }} P95 latency is {{ $value | printf \"%.0f\" }}ms. (threshold: 500ms)"
          dashboard_url: "/d/unified-view/unified-view"

      - alert: LatencyP95Warning
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
          ) * 1000 > 300
        for: 3m
        labels:
          severity: warning
          category: sla
        annotations:
          summary: "Latency warning: P95 response time increasing"
          description: "{{ $labels.service_name }} P95 latency is {{ $value | printf \"%.0f\" }}ms. (threshold: 300ms)"

      - alert: LatencyP99High
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
          ) * 1000 > 1000
        for: 5m
        labels:
          severity: warning
          category: sla
        annotations:
          summary: "P99 Latency high"
          description: "{{ $labels.service_name }} P99 latency is {{ $value | printf \"%.0f\" }}ms. (threshold: 1000ms)"

  # =========================================================================
  # System Alerts
  # =========================================================================
  - name: system_alerts
    interval: 1m
    rules:
      - alert: SelfHealingMetricsDown
        expr: up{job="django"} == 0
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Self-Healing metrics collection failed"
          description: "Cannot scrape metrics from Django application. Check service health."

      - alert: RequestThroughputDrop
        expr: |
          (
            sum(rate(selfhealing_requests_total[5m]))
            /
            sum(rate(selfhealing_requests_total[5m] offset 1h))
          ) < 0.5
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Request throughput dropped"
          description: "Throughput is {{ $value | printf \"%.1f\" }}x compared to 1 hour ago."
