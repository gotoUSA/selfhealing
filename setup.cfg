# setup.cfg - mutmut configuration
# Separate config to avoid conflicts with pyproject.toml pytest settings

[pydeps]
max_bacon = 3
no_show = true
exclude = django.*:rest_framework.*:celery.*:kombu.*:redis.*

[mutmut]
paths_to_mutate=shopping/services/payment_service.py,shopping/services/point_service.py,shopping/services/cart_service.py,shopping/services/order_service.py,shopping/services/return_service.py,shopping/services/toss_webhook_service.py
backup=False
runner=python -m pytest -x --tb=short -q -p no:cov -p no:xdist --no-header -c pytest_mutmut.ini
tests_dir=shopping/tests/
dict_synonyms=Struct,NamedStruct
