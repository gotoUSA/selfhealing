# Stage 31: Cascade Failure Extended Test
# Docker Compose 설정
#
# 사용법:
#   docker-compose -f docker-compose.stage31.yml up -d
#   docker-compose -f docker-compose.stage31.yml -f docker-compose.yml up -d
#
# 테스트 시나리오:
#   1. Redis→DB→CB 연쇄 장애
#   2. Payment→Retry Storm→Rate Limit Deadlock
#   3. Health Check Delay→Wrong Decision

version: '3.8'

services:
  # Toxiproxy - 네트워크 장애 주입
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.6.0
    container_name: toxiproxy-stage31
    ports:
      - "8474:8474"  # Toxiproxy API
      - "6380:6380"  # Redis proxy
      - "5433:5433"  # PostgreSQL proxy
    networks:
      - cascade_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8474/version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 웹 애플리케이션
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-stage31
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://postgres:postgres@toxiproxy:5433/myproject
      - REDIS_URL=redis://toxiproxy:6380/0
      - STAGE=31
      - CASCADE_TEST_ENABLED=true
      - CB_FAILURE_THRESHOLD=5
      - CB_OPEN_TIMEOUT_S=30
      - HEALTH_CHECK_TIMEOUT_S=3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - cascade_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "stage=31"
      - "test=cascade-failure-extended"

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: db-stage31
    environment:
      - POSTGRES_DB=myproject
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # 커넥션 풀 고갈 테스트를 위한 설정
      - POSTGRES_MAX_CONNECTIONS=100
    volumes:
      - db_stage31_data:/var/lib/postgresql/data
    networks:
      - cascade_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: redis-stage31
    networks:
      - cascade_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Locust 부하 테스트
  locust-master:
    image: locustio/locust:2.20.0
    container_name: locust-master-stage31
    ports:
      - "8089:8089"
    volumes:
      - ./load_tests:/mnt/locust
    environment:
      - LOCUST_HOST=http://web:8000
      - LOCUST_LOCUSTFILE=/mnt/locust/scenarios/stage31_cascade_extended.py
      - LOCUST_TEST_DURATION=60
    command: >
      -f /mnt/locust/scenarios/stage31_cascade_extended.py
      --master
      --host=http://web:8000
    depends_on:
      - web
    networks:
      - cascade_net

  locust-worker:
    image: locustio/locust:2.20.0
    volumes:
      - ./load_tests:/mnt/locust
    environment:
      - LOCUST_HOST=http://web:8000
      - LOCUST_LOCUSTFILE=/mnt/locust/scenarios/stage31_cascade_extended.py
    command: >
      -f /mnt/locust/scenarios/stage31_cascade_extended.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    deploy:
      replicas: 2
    networks:
      - cascade_net

  # Toxiproxy 설정 초기화
  toxiproxy-setup:
    image: ghcr.io/shopify/toxiproxy:2.6.0
    container_name: toxiproxy-setup-stage31
    depends_on:
      toxiproxy:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Setting up Toxiproxy proxies for Stage 31..."

        # Wait for toxiproxy
        sleep 5

        # Create Redis proxy
        /go/bin/toxiproxy-cli create -l 0.0.0.0:6380 -u redis:6379 redis_proxy || true

        # Create PostgreSQL proxy
        /go/bin/toxiproxy-cli create -l 0.0.0.0:5433 -u db:5432 postgres_proxy || true

        echo "Proxies created:"
        /go/bin/toxiproxy-cli list

        echo "Stage 31 Toxiproxy setup complete!"
    networks:
      - cascade_net

networks:
  cascade_net:
    driver: bridge
    name: stage31_cascade_net

volumes:
  db_stage31_data:
    name: stage31_db_data
