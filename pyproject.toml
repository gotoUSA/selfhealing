# ==========================================
# Black Configuration (Code Formatting)
# ==========================================
[tool.black]
line-length = 127
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | __pycache__
  | migrations
  | staticfiles
  | media
  | htmlcov
  | \.backup
)/
'''

# ==========================================
# isort Configuration (Import Sorting)
# ==========================================
[tool.isort]
profile = "black"
line_length = 127
skip_glob = ["*/migrations/*", "venv/*", "env/*", "htmlcov/*"]
known_django = ["django"]
known_third_party = [
    "rest_framework",
    "celery",
    "redis",
    "mptt",
    "allauth",
    "dj_rest_auth",
    "drf_spectacular"
]
known_first_party = ["shopping", "myproject"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ==========================================
# pytest Configuration
# ==========================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "myproject.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*"]
addopts = """
    -n auto
    --dist=loadscope
    --cov=shopping
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70
    --tb=short
    --strict-markers
    -m 'not load_test and not manual and not concurrency and not performance and not auth_race and not payment_race and not order_race and not point_race and not return_race and not heavy and not slow'
"""
testpaths = ["shopping/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests",
    "load_test: 부하 테스트 관련 (CI에서 기본 제외)",
    "manual: 수동/디버깅용 테스트 (CI에서 기본 제외)",
    "concurrency: 동시성 테스트 (race condition 검증)",
    "auth_race: 인증 관련 race condition 테스트",
    "payment_race: 결제 관련 race condition 테스트",
    "order_race: 주문 관련 race condition 테스트",
    "point_race: 포인트 관련 race condition 테스트",
    "return_race: 반품 관련 race condition 테스트",
    "heavy: 고부하 스트레스 테스트 (CI에서 선택적 제외)",
    "schema: OpenAPI 스키마 기반 계약 테스트 (Schemathesis)",
    "stateful: Stateful API 워크플로우 테스트 (상태 전이 검증)",
    "fuzz: Fuzz 테스트 - Hypothesis/Schemathesis 기반 무작위 입력 검증",
    "negative: Negative 테스트 - 잘못된 입력에 대한 적절한 에러 처리 검증",
    "security: Security 테스트 - SQL Injection, XSS, SSTI 등 보안 공격 방어 검증",
]
filterwarnings = [
    # Ignore dj-rest-auth deprecation warnings (library internal, cannot fix)
    "ignore:app_settings.USERNAME_REQUIRED is deprecated:UserWarning:dj_rest_auth.registration.serializers",
    "ignore:app_settings.EMAIL_REQUIRED is deprecated:UserWarning:dj_rest_auth.registration.serializers",
    # Ignore factory_boy deprecation warning (library internal)
    "ignore:.*_after_postgeneration will stop saving the instance.*:DeprecationWarning:factory.django",
]

# pytest-env: 테스트 실행 전 환경 변수 설정
# Windows에서 PostgreSQL cp949 인코딩 문제 해결
[tool.pytest_env]
PGCLIENTENCODING = "UTF8"
PYTHONIOENCODING = "utf-8"

# ==========================================
# coverage Configuration
# ==========================================
[tool.coverage.run]
source = ["shopping"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "myproject/wsgi.py",
    "myproject/asgi.py",
    "load_tests/*",
]
branch = true
# Parallel testing support (pytest-xdist)
parallel = true
concurrency = ["thread", "multiprocessing"]
# 데이터 파일 경로를 명시적으로 설정
data_file = ".coverage"
# 병렬 실행 시 기존 데이터 유지하지 않음 (매번 새로 측정)
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# ==========================================
# radon Configuration (Code Complexity)
# ==========================================
[tool.radon]
exclude = "*/migrations/*,*/tests/*,*/__pycache__/*,*/venv/*"
cc_min = "C"  # 복잡도 C 이상만 표시 (A=1-5, B=6-10, C=11-20, D=21-30, E=31-40, F=41+)

# ==========================================
# bandit Configuration (Security Analysis)
# ==========================================
[tool.bandit]
exclude_dirs = ["tests", "migrations", "venv", "env", "htmlcov", "load_tests"]
skips = ["B101", "B311"]  # B101: assert 사용, B311: random (보안용 아닌 경우)
targets = ["shopping"]

# ==========================================
# vulture Configuration (Dead Code Detection)
# ==========================================
[tool.vulture]
exclude = ["*/migrations/*", "*/tests/*", "venv/", "env/", "htmlcov/"]
min_confidence = 80
paths = ["shopping"]
sort_by_size = true

# ==========================================
# mutmut Configuration (Mutation Testing)
# ==========================================
# mutmut은 setup.cfg 또는 pyproject.toml의 [tool.mutmut] 지원
# 돈 관련 서비스만 대상으로 제한
[tool.mutmut]
paths_to_mutate = [
    "shopping/services/payment_service.py",
    "shopping/services/point_service.py",
    "shopping/services/point_query_service.py",
    "shopping/services/cart_service.py",
    "shopping/services/order_service.py",
    "shopping/services/return_service.py",
    "shopping/services/toss_webhook_service.py",
]
tests_dir = "shopping/tests/"
runner = "python -m pytest -x --tb=short -q"
dict_synonyms = "Struct,NamedStruct"
