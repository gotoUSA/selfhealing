# ==========================================
# Black Configuration (Code Formatting)
# ==========================================
[tool.black]
line-length = 127
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | __pycache__
  | migrations
  | staticfiles
  | media
  | htmlcov
  | \.backup
)/
'''

# ==========================================
# isort Configuration (Import Sorting)
# ==========================================
[tool.isort]
profile = "black"
line_length = 127
skip_glob = ["*/migrations/*", "venv/*", "env/*", "htmlcov/*"]
known_django = ["django"]
known_third_party = [
    "rest_framework",
    "celery",
    "redis",
    "mptt",
    "allauth",
    "dj_rest_auth",
    "drf_spectacular"
]
known_first_party = ["shopping", "myproject"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ==========================================
# pytest Configuration
# ==========================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "myproject.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*"]
addopts = """
    -n auto
    --cov=shopping
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70
    -v
    --tb=short
    --strict-markers
    -m 'not load_test and not manual'
"""
testpaths = ["shopping/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests",
    "load_test: 부하 테스트 관련 (CI에서 기본 제외)",
    "manual: 수동/디버깅용 테스트 (CI에서 기본 제외)",
]
filterwarnings = [
    # Ignore dj-rest-auth deprecation warnings (library internal, cannot fix)
    "ignore:app_settings.USERNAME_REQUIRED is deprecated:UserWarning:dj_rest_auth.registration.serializers",
    "ignore:app_settings.EMAIL_REQUIRED is deprecated:UserWarning:dj_rest_auth.registration.serializers",
]

# ==========================================
# coverage Configuration
# ==========================================
[tool.coverage.run]
source = ["shopping"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "myproject/wsgi.py",
    "myproject/asgi.py",
    "load_tests/*",
]
branch = true
# Parallel testing support (pytest-xdist)
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
