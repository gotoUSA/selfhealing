# Stage 34: DB Deadlock Locust Extended Test
# Docker Compose 설정
#
# 사용법:
#   docker-compose -f docker-compose.stage34.yml up -d
#   docker-compose -f docker-compose.stage34.yml -f docker-compose.yml up -d
#
# 테스트 시나리오:
#   1. Concurrent Order Deadlock
#   2. Payment + Point Deadlock
#   3. Pool Exhaustion + Deadlock Compound

version: '3.8'

services:
  # 웹 애플리케이션
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-stage34
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://postgres:postgres@db:5432/myproject
      - REDIS_URL=redis://redis:6379/0
      - STAGE=34
      - DB_DEADLOCK_TEST_ENABLED=true
      # Database connection pool settings
      - DB_POOL_SIZE=100
      - DB_CONNECTION_TIMEOUT=5
      - DB_LOCK_TIMEOUT=3
      # Deadlock handling settings
      - DEADLOCK_MAX_RETRIES=3
      - DEADLOCK_DETECTION_TIMEOUT=3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - deadlock_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "stage=34"
      - "test=db-deadlock-extended"

  # PostgreSQL 데이터베이스 (Deadlock 테스트 최적화)
  db:
    image: postgres:15-alpine
    container_name: db-stage34
    environment:
      - POSTGRES_DB=myproject
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Deadlock 탐지 및 로깅
      - POSTGRES_INITDB_ARGS=--data-checksums
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "lock_timeout=3s"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_statement=all"
    volumes:
      - db_stage34_data:/var/lib/postgresql/data
      - ./scripts/init_stage34.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deadlock_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: redis-stage34
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - deadlock_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Locust 부하 테스트
  locust:
    image: locustio/locust:2.20.0
    container_name: locust-stage34
    ports:
      - "8089:8089"
    volumes:
      - ./load_tests:/mnt/locust
    command: >
      -f /mnt/locust/scenarios/stage34_db_deadlock.py
      --host=http://web:8000
      --users=100
      --spawn-rate=20
    environment:
      - LOCUST_TEST_DURATION=300
    depends_on:
      - web
    networks:
      - deadlock_net

  # pgAdmin (DB 모니터링)
  pgadmin:
    image: dpage/pgadmin4:7.8
    container_name: pgadmin-stage34
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_stage34_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - deadlock_net

  # Prometheus 메트릭 수집
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-stage34
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus-stage34.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - deadlock_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana 대시보드
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-stage34
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_stage34_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - deadlock_net

networks:
  deadlock_net:
    driver: bridge

volumes:
  db_stage34_data:
  pgadmin_stage34_data:
  grafana_stage34_data:
