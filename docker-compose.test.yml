  # ---------------------------------------------------------------------------
  test-session-signals:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/integration/django/test_session_signals.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
