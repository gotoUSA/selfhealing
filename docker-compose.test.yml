# Docker Compose for testing Stage 26, 27, 28

# ---------------------------------------------------------------------------
# Extension fields - YAML anchors to eliminate redundancy
# ---------------------------------------------------------------------------

# Common base for all test services: build context, volumes, working directory
x-base-test: &base-test
  build: .
  volumes:
    - .:/code
  working_dir: /code

# Base Python environment variables
x-base-env: &base-env
  PYTHONPATH: /code:/code/packages/selfhealing-python/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Django test environment (extends base-env)
x-django-env: &django-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: myproject.settings.test
  DATABASE_URL: postgres://shopping_user:shopping_pass@db:5432/shopping_db

# Common Redis connection variables
x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  TEST_REDIS_AVAILABLE: "true"

# OTEL test base environment (extends base-env)
x-otel-env: &otel-env
  <<: *base-env
  OTEL_COLLECTOR_ENDPOINT: http://otel-collector:4318
  COLLECTOR_HEALTH_ENDPOINT: http://otel-collector:13133

# OTEL full backends environment (extends otel-env with all backend endpoints)
x-otel-full-env: &otel-full-env
  <<: *otel-env
  TEMPO_ENDPOINT: http://tempo:3200
  MIMIR_ENDPOINT: http://mimir:9009
  LOKI_ENDPOINT: http://loki:3100

# Common depends_on: db + redis
x-depends-db-redis: &depends-db-redis
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

# Common depends_on: all OTEL backends
x-depends-otel-all: &depends-otel-all
  otel-collector:
    condition: service_healthy
  tempo:
    condition: service_healthy
  mimir:
    condition: service_healthy
  loki:
    condition: service_healthy

services:
  # PostgreSQL database for SQLAlchemy integration tests
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shopping_user
      POSTGRES_PASSWORD: shopping_pass
      POSTGRES_DB: shopping_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_user -d shopping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery and cache
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Chaos tests runner
  test-chaos:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/chaos/ -v --tb=short --no-cov"
    environment:
      <<: *django-env
      DISABLE_SELFHEALING_AUTH: "false"
    depends_on:
      <<: *depends-db-redis

  # 167. Async Audit Pipeline 통합 테스트
  test-async-audit:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_async_audit_middleware_integration.py -v --tb=short --no-cov"
    environment:
      <<: [*django-env, *redis-env]
    depends_on:
      <<: *depends-db-redis

  # Test runner for selfhealing package
  test:
    <<: *base-test
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/test_connection_pool.py tests/unit/test_graceful_shutdown.py -v --tb=short"
    environment:
      <<: *base-env

  # Stage 28-4: In-Memory Repository integration test
  test-inmemory:
    <<: *base-test
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/adapters/test_memory_repositories.py -v --tb=short &&
             python /code/scripts/test_inmemory_integration.py"
    environment:
      <<: *base-env

  # SQLAlchemy adapter integration test
  test-sqlalchemy:
    <<: *base-test
    command: >
      sh -c "pip install psycopg2-binary sqlalchemy pytest -q &&
             python scripts/test_sqlalchemy_postgres.py"
    environment:
      <<: *base-env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/test_selfhealing
    depends_on:
      db:
        condition: service_healthy

  # X-Test Cross-Region Conflict 통합 테스트 (144 문서)
  # AtomicStateQuery Lua 스크립트 실제 검증
  test-cross-region:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_xtest_cross_region_integration.py -v --tb=short --no-cov"
    environment:
      <<: [*django-env, *redis-env]
    depends_on:
      <<: *depends-db-redis

  # 179. Global Leader Election 통합 테스트
  test-leader-election:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_leader_election_integration.py -v --tb=short --no-cov -p no:xdist --override-ini='addopts='"
    environment:
      <<: [*django-env, *redis-env]
      REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *depends-db-redis

  # Hybrid Storage Architecture integration tests (Phase 7)
  test-hybrid-storage:
    <<: *base-test
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_hybrid_storage_integration.py -v --tb=short"
    environment:
      <<: *base-env
      DJANGO_SETTINGS_MODULE: myproject.settings
      DATABASE_URL: postgres://shopping_user:shopping_pass@db:5432/shopping_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *depends-db-redis

  # Statistics Repository unit tests
  test-statistics-unit:
    <<: *base-test
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/adapters/test_statistics_repository.py -v --tb=short"
    environment:
      <<: *base-env
      DJANGO_SETTINGS_MODULE: myproject.settings

  # tests/hybrid folder runner - Celery/Redis integration tests
  test-hybrid:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/hybrid/ -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *django-env
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      TEST_DB_AVAILABLE: "true"
      TEST_REDIS_AVAILABLE: "true"
      DISABLE_SELFHEALING_AUTH: "false"
    depends_on:
      <<: *depends-db-redis
      celery-worker:
        condition: service_healthy

  # Global tests folder runner - for fixing broken tests
  test-global:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/ -v --tb=short --no-cov
             --ignore=tests/load --ignore=tests/_unclassified --ignore=tests/hybrid -x"
    environment:
      <<: *django-env
      REDIS_URL: redis://redis:6379/0
      TEST_DB_AVAILABLE: "true"
      TEST_REDIS_AVAILABLE: "true"
      DISABLE_SELFHEALING_AUTH: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      <<: *depends-db-redis
      celery-worker:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery Worker - Integration Tests용 백그라운드 작업 처리
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SELFHEALING_ENABLED=true
    command: >
      sh -c "
        pip install -e /code/packages/selfhealing-python --no-deps -q &&
        celery -A myproject worker -l info -Q default,selfhealing,selfhealing.critical,dlq,payment_critical,order_processing,selfhealing_recovery,selfhealing_notifications,selfhealing_maintenance --concurrency=2
      "
    healthcheck:
      test: ["CMD-SHELL", "celery -A myproject inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Audit Integration Test Runner
  # ---------------------------------------------------------------------------
  test-audit-integration:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/integration/test_audit_wal_redis_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *django-env
      REDIS_URL: redis://redis:6379/0
      TEST_DB_AVAILABLE: "true"
      TEST_REDIS_AVAILABLE: "true"
    depends_on:
      <<: *depends-db-redis

  # Settings Redis TTL 통합 테스트
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-settings-redis-ttl
  test-settings-redis-ttl:
    <<: *base-test
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_settings_redis_ttl_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *base-env
      DJANGO_SETTINGS_MODULE: myproject.settings.test
      REDIS_URL: redis://redis:6379/15
      TEST_REDIS_AVAILABLE: "true"
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Django Web 서비스 (Grafana Webhook 테스트용)
  # ---------------------------------------------------------------------------
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    working_dir: /code
    ports:
      - "18000:8000"
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana Tempo - 분산 추적 저장소 (테스트용)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo-test
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/tempo:/etc/tempo
      - tempo_data_test:/var/tempo
    ports:
      - "13200:3200"
      - "19095:9095"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana Mimir - 메트릭 장기 저장소 (테스트용)
  # ---------------------------------------------------------------------------
  mimir:
    image: grafana/mimir:2.11.0
    container_name: mimir-test
    command: ["-config.file=/etc/mimir/mimir.yml"]
    volumes:
      - ./docker/mimir:/etc/mimir
      - mimir_data_test:/var/mimir
    ports:
      - "19009:9009"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9009/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana Loki - 로그 저장소 (테스트용)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: loki-test
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/loki:/etc/loki
      - loki_data_test:/var/loki
    ports:
      - "13100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector - 텔레메트리 수집기 (테스트용)
  # ---------------------------------------------------------------------------
  otel-collector:
    build:
      context: ./docker/otel-collector
      dockerfile: Dockerfile
      args:
        OTEL_VERSION: "0.144.0"
    container_name: otel-collector-test
    user: "0"
    command: ["--config=/etc/otelcol/otel-collector-config.yml"]
    volumes:
      - ./docker/otel-collector:/etc/otelcol
      - otel_buffer_test:/var/lib/otelcol/buffer
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18888:8888"
      - "23133:13133"
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=selfhealing-test,deployment.environment=test
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL Collector 및 Tempo 통합 테스트
  # ---------------------------------------------------------------------------
  test-otel-collector:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_otel_collector_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-env
      TEMPO_ENDPOINT: http://tempo:3200
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # OTEL Collector Metrics 파이프라인 통합 테스트
  # ---------------------------------------------------------------------------
  test-otel-metrics:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_metrics_pipeline_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-env
      MIMIR_ENDPOINT: http://mimir:9009
    depends_on:
      otel-collector:
        condition: service_healthy
      mimir:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL Collector Logs 파이프라인 통합 테스트
  # ---------------------------------------------------------------------------
  test-otel-logs:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_logs_pipeline_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-env
      LOKI_ENDPOINT: http://loki:3100
    depends_on:
      otel-collector:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL 전체 파이프라인 통합 테스트 (Traces, Metrics, Logs)
  # ---------------------------------------------------------------------------
  test-otel-all:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/ -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-full-env
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # OTEL 전체 파이프라인 E2E 테스트 (Phase 5.1)
  # ---------------------------------------------------------------------------
  test-otel-e2e:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_e2e_pipeline_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-full-env
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # OTEL 텔레메트리 상관관계 테스트 (Phase 5.3)
  # ---------------------------------------------------------------------------
  test-otel-correlation:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_telemetry_correlation_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-full-env
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # OTEL Collector 성능 테스트 (Phase 5.4)
  # ---------------------------------------------------------------------------
  test-otel-performance:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_collector_performance_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-full-env
      COLLECTOR_METRICS_ENDPOINT: http://otel-collector:8888
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # Grafana 스택 (Loki/Tempo) 대시보드 통합 테스트
  # ---------------------------------------------------------------------------
  test-grafana-stack:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_grafana_stack_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-env
      TEMPO_ENDPOINT: http://tempo:3200
      LOKI_ENDPOINT: http://loki:3100
    depends_on:
      otel-collector:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Mimir PromQL 호환성 및 상관관계 E2E 테스트
  # ---------------------------------------------------------------------------
  test-mimir-correlation:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_mimir_correlation_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-full-env
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # Grafana 검증 기준 통합 테스트 (web 서비스 포함)
  # ---------------------------------------------------------------------------
  test-grafana-verification:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_grafana_verification_criteria.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-full-env
      WEB_ENDPOINT: http://web:8000
    depends_on:
      <<: *depends-otel-all
      web:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL Collector file_storage 익스텐션 통합 테스트
  # ---------------------------------------------------------------------------
  test-otel-file-storage:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_file_storage_extension.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *otel-env
      COLLECTOR_METRICS_ENDPOINT: http://otel-collector:8888
    depends_on:
      <<: *depends-otel-all

  # ---------------------------------------------------------------------------
  # OTEL Collector redaction processor 및 prometheusremotewrite 통합 테스트
  # ---------------------------------------------------------------------------
  test-otel-redaction:
    <<: *base-test
    command: >
      sh -c "sleep 5 && pip install pyyaml requests pytest -q &&
             python -m pytest tests/integration/otel/test_redaction_processor.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *base-env
      COLLECTOR_HEALTH_ENDPOINT: http://otel-collector:13133
      COLLECTOR_METRICS_ENDPOINT: http://otel-collector:8888/metrics
    depends_on:
      otel-collector:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Agent-Gateway 2단계 아키텍처 설정 검증 테스트
  # ---------------------------------------------------------------------------
  test-otel-agent-gateway:
    <<: *base-test
    command: >
      sh -c "pip install pyyaml requests pytest -q &&
             python -m pytest tests/integration/otel/test_agent_gateway_architecture.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: *base-env
      OTEL_AGENT_GATEWAY_TEST: "false"

  # ---------------------------------------------------------------------------
  # Throttle ↔ Circuit Breaker 통합 시나리오 테스트
  # ---------------------------------------------------------------------------
  test-throttle-cb-scenario:
    <<: *base-test
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_throttle_cb_full_scenario.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: [*django-env, *redis-env]
    depends_on:
      <<: *depends-db-redis

  # ---------------------------------------------------------------------------
  # Throttle Redis Race Condition 분산 환경 테스트
  # ---------------------------------------------------------------------------
  test-throttle-race-condition:
    <<: *base-test
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_throttle_redis_race_condition.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: [*django-env, *redis-env]
    depends_on:
      <<: *depends-db-redis

  # ==========================================================================
  # Kafka Event Bus 통합 테스트 (175 문서)
  # ==========================================================================

  # Kafka 브로커 (KRaft 모드 - Zookeeper 불필요)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 218. Session Signal Integration Test
  # ---------------------------------------------------------------------------
  test-session-signals:
    <<: *base-test
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/integration/django/test_session_signals.py -v --tb=short --no-cov --override-ini='addopts='"
    environment:
      <<: [*django-env, *redis-env]
    depends_on:
      <<: *depends-db-redis

  # ---------------------------------------------------------------------------
  # 213. Postmortem Celery Delegation 통합 테스트
  # ---------------------------------------------------------------------------
  test-postmortem-celery-delegation:
    <<: *base-test
    command: >
      sh -c "pip uninstall crontab -y -q 2>/dev/null;
             python -m pytest tests/integration/selfhealing/test_postmortem_audit_integration.py tests/integration/selfhealing/test_postmortem_auto_trigger_integration.py -v --tb=short --no-cov --override-ini='addopts=' -p no:cacheprovider --create-db"
    environment:
      <<: [*django-env, *redis-env]
    depends_on:
      <<: *depends-db-redis

  # Kafka Event Bus 통합 테스트 러너
  test-kafka-event-bus:
    <<: *base-test
    command: >
      sh -c "pip install confluent-kafka -q &&
             cd /code/packages/selfhealing-python &&
             pip install -e . -q &&
             python -m pytest tests/integration/kafka/ -v --tb=short --no-cov"
    environment:
      <<: *base-env
      SELFHEALING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SELFHEALING_KAFKA_TOPIC_PREFIX: "test.selfhealing."
      ENVIRONMENT: development
    depends_on:
      kafka:
        condition: service_healthy

  # 219. Hash Chain Integrity Triad 통합 테스트
  test-integrity-triad:
    <<: *base-test
    command: >
      sh -c "pip uninstall -y crontab 2>/dev/null;
             python -m pytest tests/integration/selfhealing/test_integrity_triad_integration.py -v --tb=short --no-cov -p no:xdist --override-ini='addopts='"
    environment:
      <<: [*django-env, *redis-env]
      REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *depends-db-redis

  # 221. 티어별 차등 임계치 / 리전별 버짓 분리 통합 테스트
  test-tiered-regional-error-budget:
    <<: *base-test
    command: >
      sh -c "pip uninstall -y crontab 2>/dev/null;
             python -m pytest tests/integration/selfhealing/test_tiered_regional_error_budget_integration.py -v --tb=short --no-cov -p no:xdist --override-ini='addopts='"
    environment:
      <<: [*django-env, *redis-env]
      REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *depends-db-redis

volumes:
  postgres_test_data:
  otel_buffer_test:
  tempo_data_test:
  mimir_data_test:
  loki_data_test:
