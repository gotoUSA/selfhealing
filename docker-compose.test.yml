# Docker Compose for testing Stage 26, 27, 28
services:
  # PostgreSQL database for SQLAlchemy integration tests
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shopping_user
      POSTGRES_PASSWORD: shopping_pass
      POSTGRES_DB: shopping_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_user -d shopping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery and cache
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Chaos tests runner
  test-chaos:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/chaos/ -v --tb=short --no-cov"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - DISABLE_SELFHEALING_AUTH=false  # RBAC 테스트 시 인증 바이패스 비활성화
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 167. Async Audit Pipeline 통합 테스트
  test-async-audit:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_async_audit_middleware_integration.py -v --tb=short --no-cov"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Test runner for selfhealing package
  test:
    build: .
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/test_connection_pool.py tests/unit/test_graceful_shutdown.py -v --tb=short"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  # Stage 28-4: In-Memory Repository integration test
  test-inmemory:
    build: .
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/adapters/test_memory_repositories.py -v --tb=short &&
             python /code/scripts/test_inmemory_integration.py"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  # SQLAlchemy adapter integration test
  test-sqlalchemy:
    build: .
    command: >
      sh -c "pip install psycopg2-binary sqlalchemy pytest -q &&
             python scripts/test_sqlalchemy_postgres.py"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/test_selfhealing
    depends_on:
      db:
        condition: service_healthy

  # X-Test Cross-Region Conflict 통합 테스트 (144 문서)
  # AtomicStateQuery Lua 스크립트 실제 검증
  test-cross-region:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_xtest_cross_region_integration.py -v --tb=short --no-cov"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 179. Global Leader Election 통합 테스트
  test-leader-election:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_leader_election_integration.py -v --tb=short --no-cov -p no:xdist --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Hybrid Storage Architecture integration tests (Phase 7)
  test-hybrid-storage:
    build: .
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_hybrid_storage_integration.py -v --tb=short"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Statistics Repository unit tests
  test-statistics-unit:
    build: .
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/adapters/test_statistics_repository.py -v --tb=short"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings

  # tests/hybrid folder runner - Celery/Redis integration tests
  test-hybrid:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/hybrid/ -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - TEST_DB_AVAILABLE=true
      - TEST_REDIS_AVAILABLE=true
      - DISABLE_SELFHEALING_AUTH=false  # RBAC 테스트 시 인증 바이패스 비활성화
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy

  # Global tests folder runner - for fixing broken tests
  test-global:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/ -v --tb=short --no-cov
             --ignore=tests/load --ignore=tests/_unclassified --ignore=tests/hybrid -x"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - TEST_DB_AVAILABLE=true
      - TEST_REDIS_AVAILABLE=true
      - DISABLE_SELFHEALING_AUTH=false  # RBAC 테스트 시 인증 바이패스 비활성화
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery Worker - Integration Tests용 백그라운드 작업 처리
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SELFHEALING_ENABLED=true
    command: >
      sh -c "
        pip install -e /code/packages/selfhealing-python --no-deps -q &&
        celery -A myproject worker -l info -Q default,selfhealing,selfhealing.critical,dlq,payment_critical,order_processing,selfhealing_recovery,selfhealing_notifications,selfhealing_maintenance --concurrency=2
      "
    healthcheck:
      test: ["CMD-SHELL", "celery -A myproject inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Audit Integration Test Runner
  # ---------------------------------------------------------------------------
  test-audit-integration:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/integration/test_audit_wal_redis_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - TEST_DB_AVAILABLE=true
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Settings Redis TTL 통합 테스트
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-settings-redis-ttl
  test-settings-redis-ttl:
    build: .
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_settings_redis_ttl_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - REDIS_URL=redis://redis:6379/15
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Django Web 서비스 (Grafana Webhook 테스트용)
  # ---------------------------------------------------------------------------
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    working_dir: /code
    ports:
      - "18000:8000"
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana Tempo - 분산 추적 저장소 (테스트용)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo-test
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/tempo:/etc/tempo
      - tempo_data_test:/var/tempo
    ports:
      - "13200:3200"
      - "19095:9095"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana Mimir - 메트릭 장기 저장소 (테스트용)
  # ---------------------------------------------------------------------------
  mimir:
    image: grafana/mimir:2.11.0
    container_name: mimir-test
    command: ["-config.file=/etc/mimir/mimir.yml"]
    volumes:
      - ./docker/mimir:/etc/mimir
      - mimir_data_test:/var/mimir
    ports:
      - "19009:9009"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9009/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana Loki - 로그 저장소 (테스트용)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: loki-test
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/loki:/etc/loki
      - loki_data_test:/var/loki
    ports:
      - "13100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector - 텔레메트리 수집기 (테스트용)
  # ---------------------------------------------------------------------------
  # 참고: Alpine 기반 커스텀 이미지로 wget 헬스체크 지원
  # v0.115.0: redaction processor가 traces, logs, metrics 모두 지원
  # ---------------------------------------------------------------------------
  otel-collector:
    build:
      context: ./docker/otel-collector
      dockerfile: Dockerfile
      args:
        OTEL_VERSION: "0.144.0"
    container_name: otel-collector-test
    user: "0"
    command: ["--config=/etc/otelcol/otel-collector-config.yml"]
    volumes:
      - ./docker/otel-collector:/etc/otelcol
      - otel_buffer_test:/var/lib/otelcol/buffer
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18888:8888"
      - "23133:13133"
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=selfhealing-test,deployment.environment=test
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL Collector 및 Tempo 통합 테스트
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-otel-collector
  # ---------------------------------------------------------------------------
  test-otel-collector:
    build: .
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_otel_collector_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318
      - TEMPO_ENDPOINT=http://tempo:3200
      - COLLECTOR_HEALTH_ENDPOINT=http://otel-collector:13133
    depends_on:
      otel-collector:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL Collector Metrics 파이프라인 통합 테스트
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-otel-metrics
  # ---------------------------------------------------------------------------
  test-otel-metrics:
    build: .
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_metrics_pipeline_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318
      - MIMIR_ENDPOINT=http://mimir:9009
      - COLLECTOR_HEALTH_ENDPOINT=http://otel-collector:13133
    depends_on:
      otel-collector:
        condition: service_healthy
      mimir:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL Collector Logs 파이프라인 통합 테스트
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-otel-logs
  # ---------------------------------------------------------------------------
  test-otel-logs:
    build: .
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_logs_pipeline_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318
      - LOKI_ENDPOINT=http://loki:3100
      - COLLECTOR_HEALTH_ENDPOINT=http://otel-collector:13133
    depends_on:
      otel-collector:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL 전체 파이프라인 통합 테스트 (Traces, Metrics, Logs)
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-otel-all
  # ---------------------------------------------------------------------------
  test-otel-all:
    build: .
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/ -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318
      - TEMPO_ENDPOINT=http://tempo:3200
      - MIMIR_ENDPOINT=http://mimir:9009
      - LOKI_ENDPOINT=http://loki:3100
      - COLLECTOR_HEALTH_ENDPOINT=http://otel-collector:13133
    depends_on:
      otel-collector:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL 전체 파이프라인 E2E 테스트 (Phase 5.1)
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-otel-e2e
  # ---------------------------------------------------------------------------
  test-otel-e2e:
    build: .
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_e2e_pipeline_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318
      - TEMPO_ENDPOINT=http://tempo:3200
      - MIMIR_ENDPOINT=http://mimir:9009
      - LOKI_ENDPOINT=http://loki:3100
      - COLLECTOR_HEALTH_ENDPOINT=http://otel-collector:13133
    depends_on:
      otel-collector:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OTEL 텔레메트리 상관관계 테스트 (Phase 5.3)
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-otel-correlation
  # ---------------------------------------------------------------------------
  test-otel-correlation:
    build: .
    command: >
      sh -c "sleep 5 && pip install requests pytest -q &&
             python -m pytest tests/integration/otel/test_telemetry_correlation_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
