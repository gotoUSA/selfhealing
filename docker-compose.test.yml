# Docker Compose for testing Stage 26, 27, 28
services:
  # PostgreSQL database for SQLAlchemy integration tests
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shopping_user
      POSTGRES_PASSWORD: shopping_pass
      POSTGRES_DB: shopping_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_user -d shopping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery and cache
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Chaos tests runner
  test-chaos:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/chaos/ -v --tb=short --no-cov"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - DISABLE_SELFHEALING_AUTH=false  # RBAC 테스트 시 인증 바이패스 비활성화
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Test runner for selfhealing package
  test:
    build: .
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/test_connection_pool.py tests/unit/test_graceful_shutdown.py -v --tb=short"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  # Stage 28-4: In-Memory Repository integration test
  test-inmemory:
    build: .
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/adapters/test_memory_repositories.py -v --tb=short &&
             python /code/scripts/test_inmemory_integration.py"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  # SQLAlchemy adapter integration test
  test-sqlalchemy:
    build: .
    command: >
      sh -c "pip install psycopg2-binary sqlalchemy pytest -q &&
             python scripts/test_sqlalchemy_postgres.py"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/test_selfhealing
    depends_on:
      db:
        condition: service_healthy

  # Hybrid Storage Architecture integration tests (Phase 7)
  test-hybrid-storage:
    build: .
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_hybrid_storage_integration.py -v --tb=short"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Statistics Repository unit tests
  test-statistics-unit:
    build: .
    command: >
      sh -c "cd /code/packages/selfhealing-python &&
             pip install -e . &&
             python -m pytest tests/unit/adapters/test_statistics_repository.py -v --tb=short"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings

  # tests/hybrid folder runner - Celery/Redis integration tests
  test-hybrid:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/hybrid/ -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - TEST_DB_AVAILABLE=true
      - TEST_REDIS_AVAILABLE=true
      - DISABLE_SELFHEALING_AUTH=false  # RBAC 테스트 시 인증 바이패스 비활성화
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy

  # Global tests folder runner - for fixing broken tests
  test-global:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/ -v --tb=short --no-cov
             --ignore=tests/load --ignore=tests/_unclassified --ignore=tests/hybrid -x"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - TEST_DB_AVAILABLE=true
      - TEST_REDIS_AVAILABLE=true
      - DISABLE_SELFHEALING_AUTH=false  # RBAC 테스트 시 인증 바이패스 비활성화
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery Worker - Integration Tests용 백그라운드 작업 처리
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SELFHEALING_ENABLED=true
    command: >
      sh -c "
        pip install -e /code/packages/selfhealing-python --no-deps -q &&
        celery -A myproject worker -l info -Q default,selfhealing,selfhealing.critical,dlq,payment_critical,order_processing,selfhealing_recovery,selfhealing_notifications,selfhealing_maintenance --concurrency=2
      "
    healthcheck:
      test: ["CMD-SHELL", "celery -A myproject inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Audit Integration Test Runner
  # ---------------------------------------------------------------------------
  test-audit-integration:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/self_healing/integration/test_audit_wal_redis_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - DATABASE_URL=postgres://shopping_user:shopping_pass@db:5432/shopping_db
      - REDIS_URL=redis://redis:6379/0
      - TEST_DB_AVAILABLE=true
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Settings Redis TTL 통합 테스트
  # 실행: docker-compose -f docker-compose.test.yml run --rm test-settings-redis-ttl
  test-settings-redis-ttl:
    build: .
    command: >
      sh -c "pip install redis pytest -q &&
             python manage.py migrate --noinput &&
             python -m pytest tests/integration/selfhealing/test_settings_redis_ttl_integration.py -v --tb=short --no-cov --override-ini='addopts='"
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/packages/selfhealing-python/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=myproject.settings.test
      - REDIS_URL=redis://redis:6379/15
      - TEST_REDIS_AVAILABLE=true
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_test_data:
